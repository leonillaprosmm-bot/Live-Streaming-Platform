<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStream Studio — Прямой эфир</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { studio: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937', 600: '#374151', accent: '#ff0050', accentHover: '#e00045', cyan: '#00f2fe' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        @keyframes floatUp { 0% { transform: translateY(0px) scale(0.6); opacity: 1; } 50% { transform: translateY(-180px) scale(1.2); opacity: 0.8; } 100% { transform: translateY(-350px) scale(1.6); opacity: 0; } }
        .floating-heart { position: absolute; animation: floatUp 3s ease-in-out forwards; pointer-events: none; }
        .screen { display: none; }
        .screen.active { display: flex; }

        /* Главное видео (ведущий) */
        .main-video-box { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; width: 100%; }
        .main-video-box video { width: 100%; height: 100%; object-fit: cover; }

        /* Маленькие окна гостей */
        .guest-tile { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
        .guest-tile:hover { border-color: #00f2fe; }
        .guest-tile.active { border-color: #ff0050; }
        .guest-tile video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="bg-studio-900 text-gray-100 min-h-screen antialiased">

    <!-- ============ ЭКРАН 1: ВХОД ============ -->
    <div id="screen-welcome" class="screen active min-h-screen flex-col items-center justify-center p-4">
        <div class="max-w-md w-full">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-r from-studio-accent to-studio-cyan shadow-lg mb-4">
                    <i class="fa-solid fa-video text-2xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">ProStream Studio</h1>
                <p class="text-gray-400 text-sm">Прямой эфир</p>
            </div>

            <div class="bg-studio-800 rounded-2xl border border-studio-700 p-6 shadow-2xl space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-2 font-medium">Ваше имя</label>
                    <input type="text" id="inputName" placeholder="Например: Иван" maxlength="30"
                        class="w-full bg-studio-900 border border-studio-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-studio-accent transition">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-2 font-medium">Пароль ведущего</label>
                    <input type="password" id="inputHostKey" placeholder="Оставь пустым, если ты гость"
                        class="w-full bg-studio-900 border border-studio-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-studio-accent transition">
                    <p class="text-[10px] text-gray-500 mt-1">Гости — пусто. Ведущий — свой пароль (по умолчанию <code class="text-studio-cyan">admin123</code>)</p>
                </div>

                <button onclick="enterStream()" class="w-full bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white py-3 rounded-xl text-sm font-bold transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right"></i> Войти в эфир
                </button>
            </div>
        </div>
    </div>

    <!-- ============ ЭКРАН 2: ЭФИР ============ -->
    <div id="screen-room" class="screen min-h-screen flex-col">
        <!-- Шапка -->
        <header class="bg-studio-800 border-b border-studio-700 px-4 py-3 flex items-center justify-between z-30 flex-wrap gap-2">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-studio-accent to-studio-cyan p-2 rounded-xl text-white shadow-lg">
                    <i class="fa-solid fa-video text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm text-white flex items-center gap-2">
                        Прямой эфир
                        <span class="bg-red-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">● LIVE</span>
                    </h1>
                    <p id="roomSubtitle" class="text-[10px] text-gray-400">—</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <div class="flex items-center bg-studio-700/60 px-3 py-1.5 rounded-lg border border-studio-600 text-xs text-gray-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>
                    <span id="participantCountHeader">1 участник</span>
                </div>

                <button onclick="copyInviteLink()" class="bg-gradient-to-r from-studio-cyan to-blue-500 hover:from-blue-500 hover:to-studio-cyan text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-link"></i> Скопировать ссылку
                </button>

                <button onclick="leaveRoom()" class="bg-red-600/20 hover:bg-red-600/40 border border-red-500/40 text-red-300 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> Выйти
                </button>
            </div>
        </header>

        <!-- Основное поле -->
        <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-3 p-3 overflow-hidden">

            <!-- Левая часть: видео -->
            <div class="lg:col-span-3 flex flex-col gap-3 overflow-hidden">

                <!-- ГЛАВНОЕ ОКНО (ведущий / активный спикер) -->
                <div class="relative flex-shrink-0">
                    <div id="mainVideoBox" class="main-video-box">
                        <div id="mainPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-studio-800 text-gray-500">
                            <i class="fa-solid fa-user text-6xl mb-3"></i>
                            <p class="text-sm">Ожидание ведущего...</p>
                        </div>
                    </div>
                    <div class="absolute bottom-3 left-3 bg-black/70 backdrop-blur-sm px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 text-white border border-white/10 z-10">
                        <i id="mainMicIcon" class="fa-solid fa-microphone text-emerald-400"></i>
                        <span id="mainNameLabel">—</span>
                        <span id="mainHostBadge" class="hidden bg-amber-500 text-black text-[9px] px-1.5 py-0.5 rounded font-bold ml-1">👑 ВЕДУЩИЙ</span>
                    </div>
                </div>

                <!-- СЕТКА ГОСТЕЙ -->
                <div class="flex-shrink-0">
                    <div class="flex items-center justify-between mb-2 px-1">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
                            <i class="fa-solid fa-users mr-1"></i> Участники
                        </h3>
                        <span id="guestsCount" class="text-xs text-gray-500">0</span>
                    </div>
                    <div id="guestGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2 max-h-[220px] overflow-y-auto">
                        <!-- Сюда автоматически добавляются окна гостей -->
                        <div id="noGuestsHint" class="col-span-full text-center py-4 text-xs text-gray-500">
                            <i class="fa-solid fa-user-plus mr-1"></i> Пока никого. Скиньте ссылку, чтобы подключились.
                        </div>
                    </div>
                </div>

                <!-- Управление -->
                <div class="bg-studio-800 border border-studio-700 rounded-2xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <button id="roomCamBtn" onclick="toggleRoomCam()" class="bg-studio-700 hover:bg-studio-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600">
                            <i id="roomCamIcon" class="fa-solid fa-video-slash text-red-400"></i> <span id="roomCamLabel">Камера</span>
                        </button>
                        <button id="roomMicBtn" onclick="toggleRoomMic()" class="bg-studio-700 hover:bg-studio-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600">
                            <i id="roomMicIcon" class="fa-solid fa-microphone-slash text-red-400"></i> <span id="roomMicLabel">Микрофон</span>
                        </button>
                    </div>

                    <button onclick="sendLikeBurst()" class="bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg">
                        <i class="fa-solid fa-heart"></i> Лайк
                    </button>
                </div>
            </div>

            <!-- Правая часть: чат -->
            <div class="lg:col-span-1 bg-studio-800 rounded-2xl border border-studio-700 flex flex-col h-[500px] lg:h-auto shadow-2xl overflow-hidden">
                <div class="p-3.5 border-b border-studio-700 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-comments text-studio-accent"></i>
                        <h2 class="font-bold text-sm text-white">Чат</h2>
                    </div>
                    <span class="bg-studio-700 text-studio-cyan text-[10px] px-2 py-0.5 rounded-full font-semibold border border-studio-600">Firebase</span>
                </div>

                <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-2 flex flex-col text-xs">
                    <div class="text-center my-2"><span class="bg-studio-700/80 text-gray-400 text-[10px] px-3 py-1 rounded-full border border-studio-600">Добро пожаловать!</span></div>
                </div>

                <div class="p-3 border-t border-studio-700">
                    <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                        <input type="text" id="chatInput" placeholder="Написать..." maxlength="300" class="flex-1 bg-studio-900 border border-studio-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-studio-accent transition">
                        <button type="submit" class="bg-studio-accent hover:bg-studio-accentHover text-white px-3 py-2 rounded-xl text-xs font-bold transition">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <div id="floatingReactionsContainer" class="fixed bottom-24 right-8 w-48 h-64 pointer-events-none overflow-hidden z-20"></div>
    </div>

    <!-- ============ ЭКРАН 3: ВЫХОД ============ -->
    <div id="screen-left" class="screen min-h-screen flex-col items-center justify-center p-4">
        <div class="text-center max-w-md">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-studio-700 mb-6">
                <i class="fa-solid fa-check text-3xl text-emerald-400"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Вы вышли из эфира</h2>
            <button onclick="returnToWelcome()" class="bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white px-6 py-3 rounded-xl text-sm font-bold transition shadow-lg mt-4">
                <i class="fa-solid fa-house mr-2"></i> На главную
            </button>
        </div>
    </div>

    <!-- ============ LIVEKIT SDK ============ -->
    <script type="module">
        import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.esm.mjs';

        const TOKEN_SERVER_URL = "https://prostream-signaling.onrender.com";
        const FIXED_ROOM = "main-studio";
        const HOST_PASSWORD = "admin123";

        window.appState = {
            name: '',
            isHost: false,
            room: null,
            isRoomCamOn: false,
            isRoomMicOn: false,
            mainVideoIdentity: null // кто сейчас в большом окне
        };

        window.showScreen = function(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // ============ ВХОД ============
        window.enterStream = async function() {
            const name = document.getElementById('inputName').value.trim();
            const hostKey = document.getElementById('inputHostKey').value;
            if (!name) { alert('Введите ваше имя'); return; }

            const isHost = (hostKey === HOST_PASSWORD);
            window.appState.name = name;
            window.appState.isHost = isHost;

            showScreen('screen-room');
            document.getElementById('roomSubtitle').innerText =
                (isHost ? '👑 Ведущий: ' : '👤 Гость: ') + name;

            await connectToLiveKit(isHost);
        };

        // ============ LIVEKIT ============
        async function connectToLiveKit(isHost) {
            try {
                const res = await fetch(`${TOKEN_SERVER_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomName: FIXED_ROOM,
                        participantName: window.appState.name
                    })
                });

                if (!res.ok) throw new Error('Не удалось получить токен');
                const { token, url } = await res.json();

                // ВАЖНО: без iceTransportPolicy — иначе на некоторых сетях не работает
                const room = new Room({
                    adaptiveStream: true,
                    dynacast: true,
                    videoCaptureDefaults: { resolution: { width: 1280, height: 720 } }
                });
                window.appState.room = room;

                room
                    .on(RoomEvent.ParticipantConnected, (p) => {
                        console.log('👤 Подключился:', p.identity);
                        updateParticipantCount();
                    })
                    .on(RoomEvent.ParticipantDisconnected, (p) => {
                        console.log('👤 Отключился:', p.identity);
                        updateParticipantCount();
                        removeGuestTile(p.identity);
                        // Если он был в главном окне — вернуть ведущего
                        if (window.appState.mainVideoIdentity === p.identity) {
                            showHostInMain();
                        }
                    })
                    .on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
                        console.log('📺 Трек от:', participant.identity, track.kind);
                        attachRemoteTrack(track, participant);
                    })
                    .on(RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
                        if (track.kind === Track.Kind.Video) {
                            const guestContainer = document.getElementById('guest-video-' + participant.identity);
                            if (guestContainer) guestContainer.innerHTML = '';
                            const mainContainer = document.getElementById('main-video-' + participant.identity);
                            if (mainContainer) mainContainer.innerHTML = '';
                        }
                    })
                    .on(RoomEvent.LocalTrackPublished, (publication) => {
                        if (publication.track) attachLocalTrack(publication.track);
                    })
                    .on(RoomEvent.Disconnected, () => console.log('❌ Отключен'));

                await room.connect(url, token);
                console.log('✅ Подключен как', isHost ? 'ВЕДУЩИЙ' : 'ГОСТЬ');

                if (isHost) {
                    await room.localParticipant.enableCameraAndMicrophone();
                    window.appState.isRoomCamOn = true;
                    window.appState.isRoomMicOn = true;
                } else {
                    await room.localParticipant.setMicrophoneEnabled(false);
                    await room.localParticipant.setCameraEnabled(false);
                    window.appState.isRoomCamOn = false;
                    window.appState.isRoomMicOn = false;
                }
                updateRoomIcons();

                // Сразу рисуем уже подключённых
                room.remoteParticipants.forEach((p) => {
                    p.trackPublications.forEach((pub) => {
                        if (pub.track && pub.isSubscribed) {
                            attachRemoteTrack(pub.track, p);
                        }
                    });
                });

                room.localParticipant.trackPublications.forEach((pub) => {
                    if (pub.track) attachLocalTrack(pub.track);
                });

                updateParticipantCount();

            } catch (err) {
                console.error('❌ Ошибка LiveKit:', err);
                alert('Ошибка подключения: ' + err.message);
            }
        }

        // ============ ГЛАВНОЕ ОКНО ============
        function setMainVideo(identity, name, isHost) {
            window.appState.mainVideoIdentity = identity;

            document.getElementById('mainPlaceholder').style.display = 'none';
            document.getElementById('mainNameLabel').innerText = name;
            document.getElementById('mainHostBadge').style.display = isHost ? 'inline-block' : 'none';

            // Если в главном окне новое видео — очищаем старое
            const mainBox = document.getElementById('mainVideoBox');
            mainBox.querySelectorAll('video').forEach(v => v.remove());

            // Переносим видео из гостевого тайла (или локальное)
            const sourceContainer = identity === window.appState.name
                ? document.getElementById('guest-video-' + identity)
                : document.getElementById('guest-video-' + identity);

            if (sourceContainer) {
                const videoEl = sourceContainer.querySelector('video');
                if (videoEl) {
                    const clone = videoEl.cloneNode(true);
                    clone.className = 'w-full h-full object-cover';
                    if (identity === window.appState.name) clone.style.transform = 'scaleX(-1)';
                    mainBox.appendChild(clone);
                }
            }
        }

        function showHostInMain() {
            // Ищем ведущего среди участников
            const room = window.appState.room;
            if (!room) return;

            // Если мы сами ведущий
            if (window.appState.isHost) {
                const localVideo = document.querySelector('#guest-video-' + window.appState.name + ' video');
                if (localVideo) {
                    setMainVideo(window.appState.name, window.appState.name + ' (Вы)', true);
                } else {
                    // Ещё не опубликовали трек — покажем заглушку
                    document.getElementById('mainPlaceholder').style.display = 'flex';
                }
                return;
            }

            // Если мы гость — ищем ведущего среди удалённых
            let hostFound = false;
            room.remoteParticipants.forEach((p) => {
                if (!hostFound) {
                    setMainVideo(p.identity, p.identity, true);
                    hostFound = true;
                }
            });

            if (!hostFound) {
                document.getElementById('mainPlaceholder').style.display = 'flex';
                document.getElementById('mainNameLabel').innerText = 'Ожидание ведущего...';
                document.getElementById('mainHostBadge').style.display = 'none';
            }
        }

        // ============ ГОСТЕВЫЕ ТАЙЛЫ ============
        function createGuestTile(identity, isLocal) {
            let tile = document.getElementById('guest-tile-' + identity);
            if (tile) return tile;

            // Скрываем подсказку "пока никого"
            const hint = document.getElementById('noGuestsHint');
            if (hint) hint.style.display = 'none';

            tile = document.createElement('div');
            tile.id = 'guest-tile-' + identity;
            tile.className = 'guest-tile relative';
            tile.onclick = () => {
                // Клик по тайлу — показать его в главном окне
                setMainVideo(identity, identity + (isLocal ? ' (Вы)' : ''), false);
                document.querySelectorAll('.guest-tile').forEach(t => t.classList.remove('active'));
                tile.classList.add('active');
            };
            tile.innerHTML = `
                <div id="guest-video-${identity}" class="w-full h-full bg-studio-900 flex items-center justify-center">
                    <div class="text-center text-gray-500">
                        <i class="fa-solid fa-user text-2xl mb-1"></i>
                        <p class="text-[9px]">камера off</p>
                    </div>
                </div>
                <div class="absolute bottom-1 left-1 bg-black/70 px-1.5 py-0.5 rounded text-[9px] font-medium text-white">
                    ${isLocal ? 'Вы' : identity}
                </div>
            `;
            document.getElementById('guestGrid').appendChild(tile);
            updateGuestsCount();
            return tile;
        }

        function removeGuestTile(identity) {
            const tile = document.getElementById('guest-tile-' + identity);
            if (tile) tile.remove();
            updateGuestsCount();

            // Если никого не осталось — показать подсказку
            const remaining = document.querySelectorAll('.guest-tile').length;
            if (remaining === 0) {
                const hint = document.getElementById('noGuestsHint');
                if (hint) hint.style.display = 'block';
            }
        }

        function updateGuestsCount() {
            const count = document.querySelectorAll('.guest-tile').length;
            document.getElementById('guestsCount').innerText = count;
        }

        // ============ ОТОБРАЖЕНИЕ ТРЕКОВ ============
        function attachLocalTrack(track) {
            if (track.kind === Track.Kind.Video) {
                createGuestTile(window.appState.name, true);
                const container = document.getElementById('guest-video-' + window.appState.name);
                container.innerHTML = '';
                const videoEl = track.attach();
                videoEl.className = 'w-full h-full object-cover transform -scale-x-100';
                container.appendChild(videoEl);

                // Если я ведущий — сразу ставлю себя в главное окно
                if (window.appState.isHost) {
                    setMainVideo(window.appState.name, window.appState.name + ' (Вы)', true);
                }
            }
        }

        function attachRemoteTrack(track, participant) {
            if (track.kind === Track.Kind.Video) {
                createGuestTile(participant.identity, false);
                const container = document.getElementById('guest-video-' + participant.identity);
                container.innerHTML = '';
                const videoEl = track.attach();
                videoEl.className = 'w-full h-full object-cover';
                container.appendChild(videoEl);

                // Если я гость и это первый удалённый — показать в главном окне
                if (!window.appState.isHost && !window.appState.mainVideoIdentity) {
                    setMainVideo(participant.identity, participant.identity, true);
                }
            } else if (track.kind === Track.Kind.Audio) {
                const audioEl = track.attach();
                audioEl.autoplay = true;
                document.body.appendChild(audioEl);
            }
        }

        // ============ ССЫЛКА ============
        window.copyInviteLink = function() {
            const link = window.location.origin + window.location.pathname;
            navigator.clipboard.writeText(link).then(() => {
                showToast('✅ Ссылка скопирована!');
            }).catch(() => prompt('Скопируйте ссылку:', link));
        };

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-xl shadow-2xl z-[100] font-medium text-sm';
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        // ============ УПРАВЛЕНИЕ ============
        window.toggleRoomCam = async function() {
            if (!window.appState.room) return;
            try {
                const newState = !window.appState.isRoomCamOn;
                await window.appState.room.localParticipant.setCameraEnabled(newState);
                window.appState.isRoomCamOn = newState;
                updateRoomIcons();
            } catch (err) {
                console.error('Ошибка камеры:', err);
            }
        };

        window.toggleRoomMic = async function() {
            if (!window.appState.room) return;
            try {
                const newState = !window.appState.isRoomMicOn;
                await window.appState.room.localParticipant.setMicrophoneEnabled(newState);
                window.appState.isRoomMicOn = newState;
                updateRoomIcons();
            } catch (err) {
                console.error('Ошибка микрофона:', err);
            }
        };

        function updateRoomIcons() {
            const camOn = window.appState.isRoomCamOn;
            const micOn = window.appState.isRoomMicOn;
            document.getElementById('roomCamIcon').className = camOn ? 'fa-solid fa-video text-studio-cyan' : 'fa-solid fa-video-slash text-red-400';
            document.getElementById('roomMicIcon').className = micOn ? 'fa-solid fa-microphone text-emerald-400' : 'fa-solid fa-microphone-slash text-red-400';
        }

        function updateParticipantCount() {
            if (!window.appState.room) return;
            const count = window.appState.room.remoteParticipants.size + 1;
            const word = count === 1 ? 'участник' : (count < 5 ? 'участника' : 'участников');
            document.getElementById('participantCountHeader').innerText = `${count} ${word}`;
        }

        // ============ ВЫХОД ============
        window.leaveRoom = function() {
            if (window.appState.room) {
                window.appState.room.disconnect();
                window.appState.room = null;
            }
            document.getElementById('guestGrid').innerHTML = '<div id="noGuestsHint" class="col-span-full text-center py-4 text-xs text-gray-500"><i class="fa-solid fa-user-plus mr-1"></i> Пока никого.</div>';
            document.getElementById('mainVideoBox').innerHTML = '<div id="mainPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-studio-800 text-gray-500"><i class="fa-solid fa-user text-6xl mb-3"></i><p class="text-sm">Ожидание ведущего...</p></div>';
            window.appState.mainVideoIdentity = null;
            showScreen('screen-left');
        };

        window.returnToWelcome = function() {
            showScreen('screen-welcome');
            document.getElementById('inputName').value = '';
            document.getElementById('inputHostKey').value = '';
        };
    </script>

    <!-- ============ FIREBASE: чат + лайки ============ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, serverTimestamp, query, limitToLast, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0G2ZiFEwSr3472_9SsLJUMs6RORmLFWs",
            authDomain: "meta-live-chat.firebaseapp.com",
            databaseURL: "https://meta-live-chat-default-rtdb.firebaseio.com",
            projectId: "meta-live-chat",
            storageBucket: "meta-live-chat.firebasestorage.app",
            messagingSenderId: "695456991297",
            appId: "1:695456991297:web:55961023f91b86487d1ec0"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getDatabase(fbApp);
        const FIXED_ROOM = "main-studio";
        let currentUser = null;

        signInAnonymously(auth).catch(err => console.error("Auth error:", err));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = {
                    uid: user.uid,
                    name: window.appState.name || ("@user_" + user.uid.slice(0, 5)),
                    avatar: "https://placehold.co/24x24/111827/ffffff?text=" + user.uid.charAt(0).toUpperCase()
                };
                console.log("🔥 Firebase OK");
            }
        });

        const chatMessages = document.getElementById('chatMessages');

        const observer = new MutationObserver(() => {
            if (document.getElementById('screen-room').classList.contains('active')) {
                if (!window._chatLoaded) {
                    window._chatLoaded = true;
                    loadMessages();
                    loadLikes();
                }
            }
        });
        observer.observe(document.getElementById('screen-room'), { attributes: true });

        function loadMessages() {
            const q = query(ref(db, `rooms/${FIXED_ROOM}/messages`), limitToLast(100));
            onValue(q, (snap) => {
                chatMessages.querySelectorAll('[data-msg]').forEach(el => el.remove());
                const data = snap.val();
                if (!data) return;
                Object.entries(data).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0)).forEach(([id, msg]) => renderMessage(id, msg));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function renderMessage(id, msg) {
            const isSelf = currentUser && msg.uid === currentUser.uid;
            const div = document.createElement('div');
            div.dataset.msg = id;
            div.className = 'flex items-start gap-2 p-2 rounded-xl border ' + (isSelf ? 'bg-studio-accent/10 border-studio-accent/40' : 'bg-studio-700/30 border-studio-700/50');
            div.innerHTML = `
                <img src="${msg.avatar}" class="w-6 h-6 rounded-full" alt="avatar">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="font-bold ${isSelf ? 'text-studio-accent' : 'text-studio-cyan'}">${escapeHtml(msg.name)}</span>
                    </div>
                    <p class="text-gray-200 mt-0.5 break-words">${escapeHtml(msg.text)}</p>
                </div>`;
            chatMessages.appendChild(div);
        }

        window.handleSendMessage = function(event) {
            event.preventDefault();
            if (!currentUser) return;
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            push(ref(db, `rooms/${FIXED_ROOM}/messages`), {
                uid: currentUser.uid,
                name: window.appState.name || currentUser.name,
                avatar: currentUser.avatar,
                text: text.slice(0, 300),
                ts: serverTimestamp()
            }).catch(err => console.error("Send error:", err));
            input.value = '';
        };

        function loadLikes() {
            const q = query(ref(db, `rooms/${FIXED_ROOM}/likes`), limitToLast(1));
            onValue(q, (snap) => {
                const data = snap.val();
                if (!data) return;
                const [id, like] = Object.entries(data)[0];
                if (currentUser && like.uid !== currentUser.uid) {
                    if (Date.now() - (like.ts || 0) < 3000) animateLikeBurst();
                }
                setTimeout(() => remove(ref(db, `rooms/${FIXED_ROOM}/likes/${id}`)).catch(() => {}), 6000);
            });
        }

        window.sendLikeBurst = function() {
            if (!currentUser) return;
            animateLikeBurst();
            push(ref(db, `rooms/${FIXED_ROOM}/likes`), { uid: currentUser.uid, ts: Date.now() }).catch(err => console.error("Like error:", err));
        };

        function animateLikeBurst() {
            const container = document.getElementById('floatingReactionsContainer');
            if (!container) return;
            const colors = ['#ff0050', '#00f2fe', '#ffd700', '#ff69b4', '#00ffcc'];
            for (let i = 0; i < 6; i++) {
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.innerHTML = `<i class="fa-solid fa-heart text-2xl" style="color:${colors[Math.floor(Math.random() * colors.length)]}"></i>`;
                h.style.left = `${Math.random() * 80 + 10}%`;
                h.style.bottom = '10px';
                container.appendChild(h);
                setTimeout(() => h.remove(), 3000);
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
