<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStream Studio — Прямой эфир</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { studio: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937', 600: '#374151', accent: '#ff0050', accentHover: '#e00045', cyan: '#00f2fe' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        @keyframes floatUp { 0% { transform: translateY(0px) scale(0.6); opacity: 1; } 50% { transform: translateY(-180px) scale(1.2); opacity: 0.8; } 100% { transform: translateY(-350px) scale(1.6); opacity: 0; } }
        .floating-heart { position: absolute; animation: floatUp 3s ease-in-out forwards; pointer-events: none; }
        .video-tile { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
        .video-tile video { width: 100%; height: 100%; object-fit: cover; }
        .screen { display: none; }
        .screen.active { display: flex; }
    </style>
</head>
<body class="bg-studio-900 text-gray-100 min-h-screen antialiased">

    <!-- ============================================================= -->
    <!-- ЭКРАН 1: ВХОД (только имя)                                     -->
    <!-- ============================================================= -->
    <div id="screen-welcome" class="screen active min-h-screen flex-col items-center justify-center p-4">
        <div class="max-w-md w-full">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-r from-studio-accent to-studio-cyan shadow-lg mb-4">
                    <i class="fa-solid fa-video text-2xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">ProStream Studio</h1>
                <p class="text-gray-400 text-sm">Прямой эфир в реальном времени</p>
            </div>

            <div class="bg-studio-800 rounded-2xl border border-studio-700 p-6 shadow-2xl space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-2 font-medium">Ваше имя</label>
                    <input type="text" id="inputName" placeholder="Например: Иван" maxlength="30"
                        class="w-full bg-studio-900 border border-studio-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-studio-accent transition">
                </div>

                <button onclick="enterStream()" class="w-full bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white py-3 rounded-xl text-sm font-bold transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right"></i> Войти в эфир
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================= -->
    <!-- ЭКРАН 2: ЭФИР                                                   -->
    <!-- ============================================================= -->
    <div id="screen-room" class="screen min-h-screen flex-col">
        <!-- Шапка -->
        <header class="bg-studio-800 border-b border-studio-700 px-4 py-3 flex items-center justify-between z-30 flex-wrap gap-2">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-studio-accent to-studio-cyan p-2 rounded-xl text-white shadow-lg">
                    <i class="fa-solid fa-video text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm text-white flex items-center gap-2">
                        Прямой эфир
                        <span class="bg-red-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">● LIVE</span>
                    </h1>
                    <p id="roomSubtitle" class="text-[10px] text-gray-400">—</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <div class="hidden md:flex items-center bg-studio-700/60 px-3 py-1.5 rounded-lg border border-studio-600 text-xs text-gray-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>
                    <span id="participantCountHeader">1 участник</span>
                </div>

                <button onclick="copyInviteLink()" class="bg-gradient-to-r from-studio-cyan to-blue-500 hover:from-blue-500 hover:to-studio-cyan text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-link"></i> Скопировать ссылку
                </button>

                <button onclick="leaveRoom()" class="bg-red-600/20 hover:bg-red-600/40 border border-red-500/40 text-red-300 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-right-from-bracket"></i> Выйти
                </button>
            </div>
        </header>

        <!-- Основное -->
        <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-3 p-3 overflow-hidden">
            <div class="lg:col-span-3 flex flex-col relative">
                <div id="videoGrid" class="flex-1 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 p-2 bg-studio-800/50 rounded-2xl border border-studio-700 overflow-y-auto auto-rows-fr">
                    <!-- LiveKit сам добавит видео -->
                </div>

                <div id="floatingReactionsContainer" class="absolute bottom-24 right-8 w-48 h-64 pointer-events-none overflow-hidden z-20"></div>

                <div class="bg-studio-800 border border-studio-700 rounded-2xl px-4 py-3 mt-3 flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <button id="roomCamBtn" onclick="toggleRoomCam()" class="bg-studio-700 hover:bg-studio-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600">
                            <i id="roomCamIcon" class="fa-solid fa-video-slash text-red-400"></i> <span id="roomCamLabel">Включить камеру</span>
                        </button>
                        <button id="roomMicBtn" onclick="toggleRoomMic()" class="bg-studio-700 hover:bg-studio-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600">
                            <i id="roomMicIcon" class="fa-solid fa-microphone-slash text-red-400"></i> <span id="roomMicLabel">Включить микрофон</span>
                        </button>
                        <button onclick="toggleScreenShare()" class="bg-studio-700 hover:bg-studio-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600">
                            <i class="fa-solid fa-desktop text-purple-400"></i> Экран
                        </button>
                    </div>

                    <button onclick="sendLikeBurst()" class="bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg">
                        <i class="fa-solid fa-heart"></i> Лайк
                    </button>
                </div>
            </div>

            <!-- Чат -->
            <div class="lg:col-span-1 bg-studio-800 rounded-2xl border border-studio-700 flex flex-col h-[600px] lg:h-auto shadow-2xl overflow-hidden">
                <div class="p-3.5 border-b border-studio-700 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-comments text-studio-accent"></i>
                        <h2 class="font-bold text-sm text-white">Чат</h2>
                    </div>
                    <span class="bg-studio-700 text-studio-cyan text-[10px] px-2 py-0.5 rounded-full font-semibold border border-studio-600">Firebase</span>
                </div>

                <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-2 flex flex-col text-xs">
                    <div class="text-center my-2"><span class="bg-studio-700/80 text-gray-400 text-[10px] px-3 py-1 rounded-full border border-studio-600">Добро пожаловать в эфир!</span></div>
                </div>

                <div class="p-3 border-t border-studio-700">
                    <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                        <input type="text" id="chatInput" placeholder="Написать..." maxlength="300" class="flex-1 bg-studio-900 border border-studio-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-studio-accent transition">
                        <button type="submit" class="bg-studio-accent hover:bg-studio-accentHover text-white px-3 py-2 rounded-xl text-xs font-bold transition">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- ============================================================= -->
    <!-- ЭКРАН 3: ПОСЛЕ ВЫХОДА                                          -->
    <!-- ============================================================= -->
    <div id="screen-left" class="screen min-h-screen flex-col items-center justify-center p-4">
        <div class="text-center max-w-md">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-studio-700 mb-6">
                <i class="fa-solid fa-check text-3xl text-emerald-400"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Вы вышли из эфира</h2>
            <button onclick="returnToWelcome()" class="bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white px-6 py-3 rounded-xl text-sm font-bold transition shadow-lg mt-4">
                <i class="fa-solid fa-house mr-2"></i> На главную
            </button>
        </div>
    </div>

    <!-- ============================================================= -->
    <!-- LIVEKIT SDK + ЛОГИКА                                            -->
    <!-- ============================================================= -->
    <script type="module">
        import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.esm.mjs';

        const TOKEN_SERVER_URL = "https://prostream-signaling.onrender.com";
        const FIXED_ROOM = "main-studio"; // ЕДИНСТВЕННАЯ комната — не показываем её юзеру

        window.appState = {
            name: '',
            isHost: false,
            room: null,
            isRoomCamOn: false,
            isRoomMicOn: false
        };

        window.showScreen = function(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // ============ ВХОД ============
        window.enterStream = async function() {
            const name = document.getElementById('inputName').value.trim();
            if (!name) { alert('Введите ваше имя'); return; }

            window.appState.name = name;
            showScreen('screen-room');
            document.getElementById('roomSubtitle').innerText = 'Вы вошли как: ' + name;

            await connectToLiveKit();
        };

        // ============ LIVEKIT ============
        async function connectToLiveKit() {
            try {
                // 1. Получаем токен
                const res = await fetch(`${TOKEN_SERVER_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomName: FIXED_ROOM,
                        participantName: window.appState.name
                    })
                });

                if (!res.ok) throw new Error('Не удалось получить токен');
                const { token, url } = await res.json();

                // 2. Комната
                const room = new Room({
                    adaptiveStream: true,
                    dynacast: true,
                    videoCaptureDefaults: { resolution: { width: 1280, height: 720 } }
                });
                window.appState.room = room;

                room
                    .on(RoomEvent.ParticipantConnected, () => updateParticipantCount())
                    .on(RoomEvent.ParticipantDisconnected, (p) => {
                        updateParticipantCount();
                        const tile = document.getElementById('tile-' + p.identity);
                        if (tile) tile.remove();
                    })
                    .on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
                        attachRemoteTrack(track, participant);
                    })
                    .on(RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
                        const container = document.getElementById('video-' + participant.identity);
                        if (container && track.kind === Track.Kind.Video) container.innerHTML = '';
                    })
                    .on(RoomEvent.LocalTrackPublished, (publication) => {
                        if (publication.track) attachLocalTrack(publication.track);
                    })
                    .on(RoomEvent.Disconnected, () => console.log('❌ Отключен'));

                // 3. Подключаемся
                await room.connect(url, token);
                console.log('✅ Подключен к LiveKit');

                // 4. КТО ПЕРВЫЙ ЗАШЁЛ — ТОТ ВЕДУЩИЙ
                //    Если в комнате уже есть другие участники → мы гость.
                //    Если мы первые → мы ведущий.
                const isFirst = room.remoteParticipants.size === 0;
                window.appState.isHost = isFirst;

                if (isFirst) {
                    // ВЕДУЩИЙ: камера+микрофон ВКЛ
                    await room.localParticipant.enableCameraAndMicrophone();
                    window.appState.isRoomCamOn = true;
                    window.appState.isRoomMicOn = true;
                    console.log('👑 Вы ведущий эфира');
                } else {
                    // ГОСТЬ: камера выключена, микрофон выключен
                    await room.localParticipant.setMicrophoneEnabled(false);
                    await room.localParticipant.setCameraEnabled(false);
                    window.appState.isRoomCamOn = false;
                    window.appState.isRoomMicOn = false;
                    console.log('👤 Вы гость эфира');
                }
                updateRoomIcons();

                // 5. Прикрепляем свои треки (если есть)
                room.localParticipant.trackPublications.forEach((pub) => {
                    if (pub.track) attachLocalTrack(pub.track);
                });

                updateParticipantCount();

            } catch (err) {
                console.error('❌ Ошибка LiveKit:', err);
                alert('Ошибка подключения: ' + err.message);
            }
        }

        // ============ ОТОБРАЖЕНИЕ ВИДЕО ============
        function createVideoTile(identity, isLocal = false) {
            let tile = document.getElementById('tile-' + identity);
            if (tile) return tile;

            tile = document.createElement('div');
            tile.id = 'tile-' + identity;
            tile.className = 'video-tile relative';
            tile.innerHTML = `
                <div id="video-${identity}" class="w-full h-full bg-studio-900 flex items-center justify-center">
                    <div class="text-center text-gray-500">
                        <i class="fa-solid fa-user text-3xl mb-2"></i>
                        <p class="text-[10px]">Камера выключена</p>
                    </div>
                </div>
                <div class="absolute bottom-2 left-2 bg-black/70 backdrop-blur-sm px-2 py-1 rounded-lg text-[10px] font-medium text-white border border-white/10">
                    <i class="fa-solid fa-user mr-1 ${isLocal ? 'text-studio-cyan' : 'text-gray-300'}"></i>
                    ${isLocal ? window.appState.name + ' (Вы)' : identity}
                </div>
            `;
            document.getElementById('videoGrid').appendChild(tile);
            return tile;
        }

        function attachLocalTrack(track) {
            if (track.kind === Track.Kind.Video) {
                createVideoTile(window.appState.name, true);
                const container = document.getElementById('video-' + window.appState.name);
                container.innerHTML = '';
                const videoEl = track.attach();
                videoEl.className = 'w-full h-full object-cover transform -scale-x-100';
                container.appendChild(videoEl);
            }
        }

        function attachRemoteTrack(track, participant) {
            if (track.kind === Track.Kind.Video) {
                createVideoTile(participant.identity, false);
                const container = document.getElementById('video-' + participant.identity);
                container.innerHTML = '';
                const videoEl = track.attach();
                videoEl.className = 'w-full h-full object-cover';
                container.appendChild(videoEl);
            } else if (track.kind === Track.Kind.Audio) {
                const audioEl = track.attach();
                audioEl.autoplay = true;
                document.body.appendChild(audioEl);
            }
        }

        // ============ КОПИРОВАНИЕ ССЫЛКИ ============
        window.copyInviteLink = function() {
            const link = window.location.origin + window.location.pathname;
            navigator.clipboard.writeText(link).then(() => {
                showToast('✅ Ссылка скопирована! Отправь её друзьям.');
            }).catch(() => {
                prompt('Скопируйте ссылку:', link);
            });
        };

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-xl shadow-2xl z-[100] font-medium text-sm';
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        // ============ УПРАВЛЕНИЕ ============
        window.toggleRoomCam = async function() {
            if (!window.appState.room) return;
            try {
                const newState = !window.appState.isRoomCamOn;
                await window.appState.room.localParticipant.setCameraEnabled(newState);
                window.appState.isRoomCamOn = newState;
                updateRoomIcons();
            } catch (err) {
                console.error('Ошибка камеры:', err);
                alert('Не удалось включить камеру: ' + err.message);
            }
        };

        window.toggleRoomMic = async function() {
            if (!window.appState.room) return;
            try {
                const newState = !window.appState.isRoomMicOn;
                await window.appState.room.localParticipant.setMicrophoneEnabled(newState);
                window.appState.isRoomMicOn = newState;
                updateRoomIcons();
            } catch (err) {
                console.error('Ошибка микрофона:', err);
            }
        };

        window.toggleScreenShare = async function() {
            if (!window.appState.room) return;
            try {
                await window.appState.room.localParticipant.setScreenShareEnabled(true);
            } catch (err) {
                console.error('Ошибка screen share:', err);
            }
        };

        function updateRoomIcons() {
            const camOn = window.appState.isRoomCamOn;
            const micOn = window.appState.isRoomMicOn;

            document.getElementById('roomCamIcon').className = camOn
                ? 'fa-solid fa-video text-studio-cyan'
                : 'fa-solid fa-video-slash text-red-400';
            document.getElementById('roomCamLabel').innerText = camOn ? 'Выключить камеру' : 'Включить камеру';

            document.getElementById('roomMicIcon').className = micOn
                ? 'fa-solid fa-microphone text-emerald-400'
                : 'fa-solid fa-microphone-slash text-red-400';
            document.getElementById('roomMicLabel').innerText = micOn ? 'Выключить микрофон' : 'Включить микрофон';
        }

        function updateParticipantCount() {
            if (!window.appState.room) return;
            const count = window.appState.room.remoteParticipants.size + 1;
            const word = count === 1 ? 'участник' : (count < 5 ? 'участника' : 'участников');
            document.getElementById('participantCountHeader').innerText = `${count} ${word}`;
        }

        // ============ ВЫХОД ============
        window.leaveRoom = function() {
            if (window.appState.room) {
                window.appState.room.disconnect();
                window.appState.room = null;
            }
            document.getElementById('videoGrid').innerHTML = '';
            showScreen('screen-left');
        };

        window.returnToWelcome = function() {
            showScreen('screen-welcome');
            document.getElementById('inputName').value = '';
        };
    </script>

    <!-- ============================================================= -->
    <!-- FIREBASE: чат + лайки                                           -->
    <!-- ============================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, serverTimestamp, query, limitToLast, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0G2ZiFEwSr3472_9SsLJUMs6RORmLFWs",
            authDomain: "meta-live-chat.firebaseapp.com",
            databaseURL: "https://meta-live-chat-default-rtdb.firebaseio.com",
            projectId: "meta-live-chat",
            storageBucket: "meta-live-chat.firebasestorage.app",
            messagingSenderId: "695456991297",
            appId: "1:695456991297:web:55961023f91b86487d1ec0"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getDatabase(fbApp);
        const FIXED_ROOM = "main-studio";
        let currentUser = null;

        signInAnonymously(auth).catch(err => console.error("Auth error:", err));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = {
                    uid: user.uid,
                    name: window.appState.name || ("@user_" + user.uid.slice(0, 5)),
                    avatar: "https://placehold.co/24x24/111827/ffffff?text=" + user.uid.charAt(0).toUpperCase()
                };
                console.log("🔥 Firebase OK");
            }
        });

        const chatMessages = document.getElementById('chatMessages');

        // Загрузка сообщений (срабатывает когда экран эфира активен)
        const observer = new MutationObserver(() => {
            if (document.getElementById('screen-room').classList.contains('active')) {
                if (!window._chatLoaded) {
                    window._chatLoaded = true;
                    loadMessages();
                    loadLikes();
                }
            }
        });
        observer.observe(document.getElementById('screen-room'), { attributes: true });

        function loadMessages() {
            const q = query(ref(db, `rooms/${FIXED_ROOM}/messages`), limitToLast(100));
            onValue(q, (snap) => {
                chatMessages.querySelectorAll('[data-msg]').forEach(el => el.remove());
                const data = snap.val();
                if (!data) return;
                Object.entries(data).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0)).forEach(([id, msg]) => renderMessage(id, msg));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function renderMessage(id, msg) {
            const isSelf = currentUser && msg.uid === currentUser.uid;
            const div = document.createElement('div');
            div.dataset.msg = id;
            div.className = 'flex items-start gap-2 p-2 rounded-xl border ' + (isSelf ? 'bg-studio-accent/10 border-studio-accent/40' : 'bg-studio-700/30 border-studio-700/50');
            div.innerHTML = `
                <img src="${msg.avatar}" class="w-6 h-6 rounded-full" alt="avatar">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="font-bold ${isSelf ? 'text-studio-accent' : 'text-studio-cyan'}">${escapeHtml(msg.name)}</span>
                    </div>
                    <p class="text-gray-200 mt-0.5 break-words">${escapeHtml(msg.text)}</p>
                </div>`;
            chatMessages.appendChild(div);
        }

        window.handleSendMessage = function(event) {
            event.preventDefault();
            if (!currentUser) return;
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            push(ref(db, `rooms/${FIXED_ROOM}/messages`), {
                uid: currentUser.uid,
                name: window.appState.name || currentUser.name,
                avatar: currentUser.avatar,
                text: text.slice(0, 300),
                ts: serverTimestamp()
            }).catch(err => console.error("Send error:", err));
            input.value = '';
        };

        function loadLikes() {
            const q = query(ref(db, `rooms/${FIXED_ROOM}/likes`), limitToLast(1));
            onValue(q, (snap) => {
                const data = snap.val();
                if (!data) return;
                const [id, like] = Object.entries(data)[0];
                if (currentUser && like.uid !== currentUser.uid) {
                    if (Date.now() - (like.ts || 0) < 3000) animateLikeBurst();
                }
                setTimeout(() => remove(ref(db, `rooms/${FIXED_ROOM}/likes/${id}`)).catch(() => {}), 6000);
            });
        }

        window.sendLikeBurst = function() {
            if (!currentUser) return;
            animateLikeBurst();
            push(ref(db, `rooms/${FIXED_ROOM}/likes`), { uid: currentUser.uid, ts: Date.now() }).catch(err => console.error("Like error:", err));
        };

        function animateLikeBurst() {
            const container = document.getElementById('floatingReactionsContainer');
            if (!container) return;
            const colors = ['#ff0050', '#00f2fe', '#ffd700', '#ff69b4', '#00ffcc'];
            for (let i = 0; i < 6; i++) {
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.innerHTML = `<i class="fa-solid fa-heart text-2xl" style="color:${colors[Math.floor(Math.random() * colors.length)]}"></i>`;
                h.style.left = `${Math.random() * 80 + 10}%`;
                h.style.bottom = '10px';
                container.appendChild(h);
                setTimeout(() => h.remove(), 3000);
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
