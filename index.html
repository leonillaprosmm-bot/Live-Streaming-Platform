<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStream Studio — Прямой эфир</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { studio: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937', 600: '#374151', accent: '#ff0050', accentHover: '#e00045', cyan: '#00f2fe' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        @keyframes floatUp { 0% { transform: translateY(0px) scale(0.6); opacity: 1; } 50% { transform: translateY(-180px) scale(1.2); opacity: 0.8; } 100% { transform: translateY(-350px) scale(1.6); opacity: 0; } }
        .floating-heart { position: absolute; animation: floatUp 3s ease-in-out forwards; pointer-events: none; }
        .screen { display: none; }
        .screen.active { display: flex; }

        .main-video-box { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; width: 100%; transition: aspect-ratio 0.3s; }
        .main-video-box.vertical { aspect-ratio: 9/16; max-width: 400px; margin: 0 auto; }
        .main-video-box video, .main-video-box canvas, .main-video-box img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }

        .guest-tile { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .guest-tile:hover { border-color: #00f2fe; }
        .guest-tile.on-stage { border-color: #ff0050; box-shadow: 0 0 20px rgba(255,0,80,0.5); }
        .guest-tile video, .guest-tile canvas { width: 100%; height: 100%; object-fit: cover; }

        .request-card { animation: slideInRight 0.4s ease-out; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .tile-menu { display: none; position: absolute; top: 4px; right: 4px; z-index: 10; }
        .guest-tile:hover .tile-menu { display: block; }

        .bg-thumb { width: 100%; aspect-ratio: 16/9; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; object-fit: cover; }
        .bg-thumb:hover { border-color: #00f2fe; transform: scale(1.03); }
        .bg-thumb.active { border-color: #ff0050; }
    </style>
</head>
<body class="bg-studio-900 text-gray-100 min-h-screen antialiased">

    <!-- ============ ЭКРАН 1: ВХОД ============ -->
    <div id="screen-welcome" class="screen active min-h-screen flex-col items-center justify-center p-4">
        <div class="max-w-md w-full">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-r from-studio-accent to-studio-cyan shadow-lg mb-4">
                    <i class="fa-solid fa-video text-2xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">ProStream Studio</h1>
                <p class="text-gray-400 text-sm">Прямой эфир с эффектами</p>
            </div>

            <div class="bg-studio-800 rounded-2xl border border-studio-700 p-6 shadow-2xl space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-2 font-medium">Ваше имя</label>
                    <input type="text" id="inputName" placeholder="Например: Иван" maxlength="30"
                        class="w-full bg-studio-900 border border-studio-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-studio-accent transition">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-2 font-medium">Пароль ведущего</label>
                    <input type="password" id="inputHostKey" placeholder="Оставь пустым, если ты гость"
                        class="w-full bg-studio-900 border border-studio-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-studio-accent transition">
                    <p class="text-[10px] text-gray-500 mt-1">Гости — пусто. Ведущий — <code class="text-studio-cyan">admin123</code></p>
                </div>

                <button onclick="enterStream()" class="w-full bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white py-3 rounded-xl text-sm font-bold transition shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right"></i> Войти в эфир
                </button>
            </div>
        </div>
    </div>

    <!-- ============ ЭКРАН 2: ЭФИР ============ -->
    <div id="screen-room" class="screen min-h-screen flex-col">
        <header class="bg-studio-800 border-b border-studio-700 px-4 py-3 flex items-center justify-between z-30 flex-wrap gap-2">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-r from-studio-accent to-studio-cyan p-2 rounded-xl text-white shadow-lg">
                    <i class="fa-solid fa-video text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm text-white flex items-center gap-2">
                        Прямой эфир
                        <span class="bg-red-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">● LIVE</span>
                    </h1>
                    <p id="roomSubtitle" class="text-[10px] text-gray-400">—</p>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <div class="flex items-center bg-studio-700/60 px-3 py-1.5 rounded-lg border border-studio-600 text-xs text-gray-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>
                    <span id="participantCountHeader">1 участник</span>
                </div>

                <button onclick="toggleOrientation()" class="bg-studio-700 hover:bg-studio-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition border border-studio-600 flex items-center gap-1.5">
                    <i id="orientationIcon" class="fa-solid fa-mobile-screen text-studio-cyan"></i>
                    <span id="orientationLabel">9:16</span>
                </button>

                <button onclick="copyInviteLink()" class="bg-gradient-to-r from-studio-cyan to-blue-500 hover:from-blue-500 hover:to-studio-cyan text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-link"></i> Ссылка
                </button>

                <button onclick="leaveRoom()" class="bg-red-600/20 hover:bg-red-600/40 border border-red-500/40 text-red-300 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                    <i class="fa-solid fa-right-from-bracket"></i> Выйти
                </button>
            </div>
        </header>

        <main class="flex-1 grid grid-cols-1 lg:grid-cols-5 gap-3 p-3 overflow-hidden">
            <div class="lg:col-span-3 flex flex-col gap-3 overflow-hidden">

                <!-- ГЛАВНОЕ ОКНО -->
                <div class="relative flex-shrink-0 flex justify-center">
                    <div id="mainVideoBox" class="main-video-box">
                        <img id="stageBgImage" src="https://placehold.co/1280x720/0b0f19/00f2fe?text=ProStream+Studio&font=montserrat" class="w-full h-full object-cover">
                    </div>

                    <div class="absolute bottom-3 left-3 bg-black/70 backdrop-blur-sm px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 text-white border border-white/10 z-10">
                        <i id="mainMicIcon" class="fa-solid fa-microphone text-emerald-400"></i>
                        <span id="mainNameLabel">Сцена свободна</span>
                        <span id="mainHostBadge" class="hidden bg-amber-500 text-black text-[9px] px-1.5 py-0.5 rounded font-bold ml-1">👑 ВЕДУЩИЙ</span>
                    </div>

                    <button id="clearStageBtn" onclick="clearStage()" class="hidden absolute top-3 right-3 bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-lg z-20">
                        <i class="fa-solid fa-xmark"></i> Убрать со сцены
                    </button>
                </div>

                <!-- УЧАСТНИКИ -->
                <div class="flex-shrink-0">
                    <div class="flex items-center justify-between mb-2 px-1">
                        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
                            <i class="fa-solid fa-users mr-1"></i> Участники
                        </h3>
                        <span id="guestsCount" class="text-xs text-gray-500">0</span>
                    </div>
                    <div id="guestGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 max-h-[240px] overflow-y-auto">
                        <div id="noGuestsHint" class="col-span-full text-center py-4 text-xs text-gray-500">
                            <i class="fa-solid fa-user-plus mr-1"></i> Пока никого.
                        </div>
                    </div>
                </div>

                <!-- УПРАВЛЕНИЕ -->
                <div class="bg-studio-800 border border-studio-700 rounded-2xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 flex-shrink-0">
                    <div class="flex items-center gap-2 flex-wrap">
                        <button id="roomCamBtn" onclick="toggleRoomCam()" class="bg-studio-700 hover:bg-studio-600 text-white px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600">
                            <i id="roomCamIcon" class="fa-solid fa-video-slash text-red-400"></i> Камера
                        </button>
                        <button id="roomMicBtn" onclick="toggleRoomMic()" class="bg-studio-700 hover:bg-studio-600 text-white px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600">
                            <i id="roomMicIcon" class="fa-solid fa-microphone-slash text-red-400"></i> Микрофон
                        </button>
                        <button id="requestStageBtn" onclick="requestStage()" class="hidden bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-lg flex items-center gap-2">
                            <i class="fa-solid fa-hand"></i> <span id="requestStageLabel">Хочу в эфир</span>
                        </button>
                    </div>

                    <button onclick="sendLikeBurst()" class="bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg">
                        <i class="fa-solid fa-heart"></i> Лайк
                    </button>
                </div>
            </div>

            <!-- СТУДИЯ (панель справа) -->
            <div id="studioPanel" class="lg:col-span-1 bg-studio-800 rounded-2xl border border-studio-700 flex flex-col h-[600px] shadow-2xl overflow-hidden hidden">
                <div class="p-3 border-b border-studio-700 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-studio-accent"></i>
                        <h2 class="font-bold text-sm text-white">Студия</h2>
                    </div>
                    <button onclick="toggleStudio()" class="text-gray-400 hover:text-white">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto p-3 space-y-4 text-xs">

                    <!-- ФОН -->
                    <div>
                        <h3 class="font-bold text-white mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-image text-studio-cyan"></i> Фон
                        </h3>
                        <div class="grid grid-cols-3 gap-1.5 mb-2">
                            <button onclick="studioSetBg('none')" class="bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Ориг</button>
                            <button onclick="studioSetBg('blur')" class="bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Блюр</button>
                            <button onclick="studioSetBg('green')" class="bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Зелёный</button>
                        </div>
                        <p class="text-[9px] text-gray-500 mb-1">Или выбери картинку:</p>
                        <div class="grid grid-cols-3 gap-1.5">
                            <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=200&h=112&fit=crop" class="bg-thumb" onclick="studioSetBg('image', this.src, this)">
                            <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=200&h=112&fit=crop" class="bg-thumb" onclick="studioSetBg('image', this.src, this)">
                            <img src="https://images.unsplash.com/photo-1557804506-669a67965ba0?w=200&h=112&fit=crop" class="bg-thumb" onclick="studioSetBg('image', this.src, this)">
                            <img src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=200&h=112&fit=crop" class="bg-thumb" onclick="studioSetBg('image', this.src, this)">
                            <img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?w=200&h=112&fit=crop" class="bg-thumb" onclick="studioSetBg('image', this.src, this)">
                            <img src="https://images.unsplash.com/photo-1541746972996-4e0b0f43e02a?w=200&h=112&fit=crop" class="bg-thumb" onclick="studioSetBg('image', this.src, this)">
                        </div>
                    </div>

                    <!-- ЭФФЕКТЫ -->
                    <div>
                        <h3 class="font-bold text-white mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-sparkles text-purple-400"></i> Эффект
                        </h3>
                        <div class="grid grid-cols-3 gap-1.5">
                            <button onclick="studioSetEffect('original', this)" class="effect-btn bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Ориг</button>
                            <button onclick="studioSetEffect('glitch', this)" class="effect-btn bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Глитч</button>
                            <button onclick="studioSetEffect('pixel', this)" class="effect-btn bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Пиксель</button>
                            <button onclick="studioSetEffect('vhs', this)" class="effect-btn bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">VHS</button>
                            <button onclick="studioSetEffect('invert', this)" class="effect-btn bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Инверт</button>
                            <button onclick="studioSetEffect('sepia', this)" class="effect-btn bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Сепия</button>
                            <button onclick="studioSetEffect('thermal', this)" class="effect-btn bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Тепло</button>
                            <button onclick="studioSetEffect('noise', this)" class="effect-btn bg-studio-700 hover:bg-studio-600 text-white p-2 rounded text-[10px] border border-studio-600">Шум</button>
                        </div>
                    </div>

                    <!-- ТЕКСТ -->
                    <div>
                        <h3 class="font-bold text-white mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-font text-amber-400"></i> Текст
                        </h3>
                        <input type="text" id="studioText" placeholder="Текст на экране..." maxlength="40"
                            oninput="studioSetText()"
                            class="w-full bg-studio-900 border border-studio-700 rounded px-2 py-1.5 text-xs text-white mb-2 focus:outline-none focus:border-studio-accent">
                        <div class="flex gap-2 items-center">
                            <input type="color" id="studioTextColor" value="#ff3366" onchange="studioSetText()" class="w-8 h-7 rounded cursor-pointer bg-transparent border border-studio-700">
                            <input type="range" id="studioTextSize" min="20" max="120" value="60" oninput="studioSetText()" class="flex-1">
                        </div>
                    </div>

                    <!-- ИНТЕНСИВНОСТЬ -->
                    <div>
                        <h3 class="font-bold text-white mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-sliders text-emerald-400"></i> Интенсивность
                        </h3>
                        <input type="range" id="studioIntensity" min="0" max="200" value="100" oninput="studioSetIntensity()" class="w-full">
                    </div>
                </div>
            </div>

            <!-- ЧАТ -->
            <div id="chatPanel" class="lg:col-span-1 bg-studio-800 rounded-2xl border border-studio-700 flex flex-col h-[600px] shadow-2xl overflow-hidden">
                <div class="p-3.5 border-b border-studio-700 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-comments text-studio-accent"></i>
                        <h2 class="font-bold text-sm text-white">Чат</h2>
                    </div>
                    <span class="bg-studio-700 text-studio-cyan text-[10px] px-2 py-0.5 rounded-full font-semibold border border-studio-600">Firebase</span>
                </div>

                <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-2 flex flex-col text-xs">
                    <div class="text-center my-2"><span class="bg-studio-700/80 text-gray-400 text-[10px] px-3 py-1 rounded-full border border-studio-600">Добро пожаловать!</span></div>
                </div>

                <div class="p-3 border-t border-studio-700">
                    <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                        <input type="text" id="chatInput" placeholder="Написать..." maxlength="300" class="flex-1 bg-studio-900 border border-studio-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-studio-accent transition">
                        <button type="submit" class="bg-studio-accent hover:bg-studio-accentHover text-white px-3 py-2 rounded-xl text-xs font-bold transition">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <!-- Кнопка "Студия" для ведущего (когда панель скрыта) -->
        <button id="openStudioBtn" onclick="toggleStudio()" class="hidden fixed bottom-24 right-6 z-30 bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white px-4 py-3 rounded-full shadow-2xl transition flex items-center gap-2 font-bold text-sm">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Студия
        </button>

        <div id="requestsContainer" class="fixed top-20 right-4 w-80 z-40 space-y-2"></div>
        <div id="floatingReactionsContainer" class="fixed bottom-24 right-8 w-48 h-64 pointer-events-none overflow-hidden z-20"></div>
    </div>

    <!-- ============ ЭКРАН 3: ВЫХОД ============ -->
    <div id="screen-left" class="screen min-h-screen flex-col items-center justify-center p-4">
        <div class="text-center max-w-md">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-studio-700 mb-6">
                <i class="fa-solid fa-check text-3xl text-emerald-400"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Вы вышли из эфира</h2>
            <button onclick="returnToWelcome()" class="bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white px-6 py-3 rounded-xl text-sm font-bold transition shadow-lg mt-4">
                <i class="fa-solid fa-house mr-2"></i> На главную
            </button>
        </div>
    </div>

    <!-- ============ LIVEKIT + STUDIO ============ -->
    <script type="module">
        import { Room, RoomEvent, Track, LocalVideoTrack, createLocalVideoTrack } from 'https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.esm.mjs';
        import { Studio } from './studio.js';

        const TOKEN_SERVER_URL = "https://prostream-signaling.onrender.com";
        const FIXED_ROOM = "main-studio";
        const HOST_PASSWORD = "admin123";

        window.appState = {
            name: '',
            isHost: false,
            room: null,
            studio: null,
            isRoomCamOn: false,
            isRoomMicOn: false,
            stageIdentity: null,
            orientation: 'horizontal'
        };

        // Создаём Studio Canvas (скрытый, для рендера)
        window.studioCanvas = document.createElement('canvas');
        window.studioCanvas.width = 1280;
        window.studioCanvas.height = 720;
        window.studioCanvas.style.display = 'none';
        document.body.appendChild(window.studioCanvas);

        window.showScreen = function(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        window.toggleStudio = function() {
            const panel = document.getElementById('studioPanel');
            const chatPanel = document.getElementById('chatPanel');
            const btn = document.getElementById('openStudioBtn');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                chatPanel.classList.add('hidden');
                btn.classList.add('hidden');
            } else {
                panel.classList.add('hidden');
                chatPanel.classList.remove('hidden');
                btn.classList.remove('hidden');
            }
        };

        // ============ ВХОД ============
        window.enterStream = async function() {
            const name = document.getElementById('inputName').value.trim();
            const hostKey = document.getElementById('inputHostKey').value;
            if (!name) { alert('Введите ваше имя'); return; }

            const isHost = (hostKey === HOST_PASSWORD);
            window.appState.name = name;
            window.appState.isHost = isHost;

            showScreen('screen-room');
            document.getElementById('roomSubtitle').innerText =
                (isHost ? '👑 Ведущий: ' : '👤 Гость: ') + name;

            if (!isHost) {
                document.getElementById('requestStageBtn').classList.remove('hidden');
            } else {
                document.getElementById('openStudioBtn').classList.remove('hidden');
            }

            await connectToLiveKit(isHost);
        };

        // ============ LIVEKIT ============
        async function connectToLiveKit(isHost) {
            try {
                const res = await fetch(`${TOKEN_SERVER_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roomName: FIXED_ROOM, participantName: window.appState.name })
                });
                if (!res.ok) throw new Error('Не удалось получить токен');
                const { token, url } = await res.json();

                const room = new Room({
                    adaptiveStream: true,
                    dynacast: true,
                    videoCaptureDefaults: { resolution: { width: 1280, height: 720 } }
                });
                window.appState.room = room;

                room
                    .on(RoomEvent.ParticipantConnected, (p) => {
                        updateParticipantCount();
                        renderGuestTile(p.identity, false);
                    })
                    .on(RoomEvent.ParticipantDisconnected, (p) => {
                        updateParticipantCount();
                        removeGuestTile(p.identity);
                        if (window.appState.stageIdentity === p.identity) clearStage();
                    })
                    .on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
                        attachRemoteTrack(track, participant);
                    })
                    .on(RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
                        if (track.kind === Track.Kind.Video) {
                            const c = document.getElementById('guest-video-' + participant.identity);
                            if (c) c.innerHTML = '<div class="text-center text-gray-500"><i class="fa-solid fa-user text-2xl mb-1"></i><p class="text-[9px]">камера off</p></div>';
                            if (window.appState.stageIdentity === participant.identity) {
                                setTimeout(() => putOnStage(participant.identity), 300);
                            }
                        }
                    })
                    .on(RoomEvent.LocalTrackPublished, (publication) => {
                        if (publication.track) attachLocalTrack(publication.track);
                    })
                    .on(RoomEvent.DataReceived, (payload, participant) => {
                        try {
                            const data = JSON.parse(new TextDecoder().decode(payload));
                            handleDataMessage(data, participant);
                        } catch (e) {}
                    })
                    .on(RoomEvent.Disconnected, () => console.log('❌ Отключен'));

                await room.connect(url, token);
                console.log('✅ Подключен как', isHost ? 'ВЕДУЩИЙ' : 'ГОСТЬ');

                if (isHost) {
                    // Ведущий: запускаем Studio (canvas → LiveKit)
                    await startHostStudio();
                } else {
                    // Гость: обычная камера, выключена
                    await room.localParticipant.setMicrophoneEnabled(false);
                    await room.localParticipant.setCameraEnabled(false);
                }
                updateRoomIcons();

                room.remoteParticipants.forEach((p) => {
                    renderGuestTile(p.identity, false);
                    p.trackPublications.forEach((pub) => {
                        if (pub.track && pub.isSubscribed) attachRemoteTrack(pub.track, p);
                    });
                });
                room.localParticipant.trackPublications.forEach((pub) => {
                    if (pub.track) attachLocalTrack(pub.track);
                });

                updateParticipantCount();

            } catch (err) {
                console.error('❌ Ошибка LiveKit:', err);
                alert('Ошибка подключения: ' + err.message);
            }
        }

        // ============ ЗАПУСК СТУДИИ У ВЕДУЩЕГО ============
        async function startHostStudio() {
            const room = window.appState.room;

            // Создаём студию
            const studio = new Studio(window.studioCanvas);
            window.appState.studio = studio;

            // Запускаем камеру → canvas
            const outputStream = await studio.start();

            // Берём видео-трек из canvas-потока
            const videoTrack = outputStream.getVideoTracks()[0];
            const audioTrack = outputStream.getAudioTracks()[0];

            // Публикуем видео из canvas в LiveKit
            await room.localParticipant.publishTrack(videoTrack, { name: 'studio-video' });

            // Публикуем аудио из камеры
            if (audioTrack) {
                await room.localParticipant.publishTrack(audioTrack, { name: 'studio-audio' });
            }

            window.appState.isRoomCamOn = true;
            window.appState.isRoomMicOn = true;
            updateRoomIcons();

            // Показываем preview студии локально в тайле
            renderGuestTile(window.appState.name, true);
            const c = document.getElementById('guest-video-' + window.appState.name);
            c.innerHTML = '';
            const preview = document.createElement('canvas');
            preview.width = 320;
            preview.height = 180;
            preview.className = 'w-full h-full object-cover';
            c.appendChild(preview);
            const pctx = preview.getContext('2d');
            setInterval(() => {
                pctx.drawImage(window.studioCanvas, 0, 0, 320, 180);
            }, 100);
        }

        // ============ СТУДИЯ: УПРАВЛЕНИЕ ============
        window.studioSetBg = function(type, imageUrl, el) {
            if (!window.appState.studio) return;
            window.appState.studio.setBackground(type, imageUrl);
            document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
            if (el) el.classList.add('active');
        };
        window.studioSetEffect = function(effect, el) {
            if (!window.appState.studio) return;
            window.appState.studio.setVideoEffect(effect);
            document.querySelectorAll('.effect-btn').forEach(b => {
                b.classList.remove('bg-studio-accent');
                b.classList.add('bg-studio-700');
            });
            if (el) {
                el.classList.remove('bg-studio-700');
                el.classList.add('bg-studio-accent');
            }
        };
        window.studioSetText = function() {
            if (!window.appState.studio) return;
            const text = document.getElementById('studioText').value;
            const color = document.getElementById('studioTextColor').value;
            const size = parseInt(document.getElementById('studioTextSize').value);
            window.appState.studio.setText(text, color);
            window.appState.studio.setTextSize(size);
        };
        window.studioSetIntensity = function() {
            if (!window.appState.studio) return;
            const val = parseInt(document.getElementById('studioIntensity').value) / 100;
            window.appState.studio.setIntensity(val);
        };

        // ============ DATA-СООБЩЕНИЯ ============
        function handleDataMessage(data, participant) {
            if (data.type === 'stage-request') {
                if (window.appState.isHost) showRequestCard(data.name, participant.identity);
            } else if (data.type === 'stage-approved') {
                if (!window.appState.isHost) enableCamThenGoOnStage();
            } else if (data.type === 'stage-denied' || data.type === 'stage-removed') {
                if (!window.appState.isHost) resetRequestButton();
            }
        }

        async function enableCamThenGoOnStage() {
            const room = window.appState.room;
            if (!room) return;
            try {
                if (!window.appState.isRoomCamOn) {
                    await room.localParticipant.setCameraEnabled(true);
                    window.appState.isRoomCamOn = true;
                }
                if (!window.appState.isRoomMicOn) {
                    await room.localParticipant.setMicrophoneEnabled(true);
                    window.appState.isRoomMicOn = true;
                }
                updateRoomIcons();
                showToast('🎉 Вы на сцене!');
            } catch (err) { console.error(err); }
        }

        function resetRequestButton() {
            const btn = document.getElementById('requestStageBtn');
            const label = document.getElementById('requestStageLabel');
            if (btn && label) {
                btn.classList.remove('opacity-50', 'pointer-events-none');
                label.innerText = 'Хочу в эфир';
            }
        }

        // ============ УЧАСТНИКИ ============
        function renderGuestTile(identity, isLocal) {
            if (document.getElementById('guest-tile-' + identity)) return;
            const hint = document.getElementById('noGuestsHint');
            if (hint) hint.style.display = 'none';

            const tile = document.createElement('div');
            tile.id = 'guest-tile-' + identity;
            tile.className = 'guest-tile';
            tile.innerHTML = `
                <div id="guest-video-${identity}" class="w-full h-full bg-studio-900 flex items-center justify-center">
                    <div class="text-center text-gray-500">
                        <i class="fa-solid fa-user text-2xl mb-1"></i>
                        <p class="text-[9px]">камера off</p>
                    </div>
                </div>
                <div class="absolute bottom-1 left-1 bg-black/70 px-1.5 py-0.5 rounded text-[9px] font-medium text-white z-[2]">
                    ${isLocal ? 'Вы' : escapeHtml(identity)}
                </div>
                ${window.appState.isHost ? `
                <div class="tile-menu">
                    <button onclick="event.stopPropagation(); hostActionPutOnStage('${escapeHtml(identity).replace(/'/g, '&#39;')}')" class="bg-amber-500 hover:bg-amber-600 text-black text-[10px] px-2 py-1 rounded font-bold shadow-lg">
                        <i class="fa-solid fa-arrow-up"></i> На сцену
                    </button>
                </div>` : ''}
            `;
            document.getElementById('guestGrid').appendChild(tile);
            updateGuestsCount();
        }

        function removeGuestTile(identity) {
            const tile = document.getElementById('guest-tile-' + identity);
            if (tile) tile.remove();
            updateGuestsCount();
            if (document.querySelectorAll('.guest-tile').length === 0) {
                const hint = document.getElementById('noGuestsHint');
                if (hint) hint.style.display = 'block';
            }
        }

        function updateGuestsCount() {
            document.getElementById('guestsCount').innerText = document.querySelectorAll('.guest-tile').length;
        }

        // ============ ТРЕКИ ============
        function attachLocalTrack(track) {
            // Локальные треки ведущего уже рендерятся из студии
            // Локальные треки гостей — покажем
            if (window.appState.isHost) return;
            if (track.kind === Track.Kind.Video) {
                renderGuestTile(window.appState.name, true);
                const c = document.getElementById('guest-video-' + window.appState.name);
                c.innerHTML = '';
                const v = track.attach();
                v.className = 'w-full h-full object-cover transform -scale-x-100';
                c.appendChild(v);
            }
        }

        function attachRemoteTrack(track, participant) {
            const isScreen = track.source === Track.Source.ScreenShare;
            const containerId = isScreen ? 'screen-' + participant.identity : participant.identity;

            if (track.kind === Track.Kind.Video) {
                renderGuestTile(containerId, false);
                const c = document.getElementById('guest-video-' + containerId);
                c.innerHTML = '';
                const v = track.attach();
                v.className = 'w-full h-full object-cover';
                c.appendChild(v);
                if (isScreen) setTimeout(() => putOnStage(containerId), 300);
            } else if (track.kind === Track.Kind.Audio) {
                const a = track.attach();
                a.autoplay = true;
                document.body.appendChild(a);
            }
        }

        // ============ СЦЕНА (ИСПРАВЛЕНО) ============
        window.putOnStage = function(identity) {
            const box = document.getElementById('mainVideoBox');
            box.querySelectorAll('video, canvas:not(#stageBgImage)').forEach(el => {
                if (el.id !== 'stageBgImage') el.remove();
            });

            const c = document.getElementById('guest-video-' + identity);
            if (!c) return;

            // Ищем видео ИЛИ canvas внутри контейнера
            const v = c.querySelector('video');
            const cv = c.querySelector('canvas');

            if (!v && !cv) {
                document.getElementById('stageBgImage').style.display = 'none';
                document.getElementById('mainNameLabel').innerText = 'Ожидание видео...';
                setTimeout(() => {
                    const c2 = document.getElementById('guest-video-' + identity);
                    const v2 = c2 ? (c2.querySelector('video') || c2.querySelector('canvas')) : null;
                    if (v2) putOnStage(identity);
                }, 1500);
                return;
            }

            document.getElementById('stageBgImage').style.display = 'none';

            if (v) {
                const clone = v.cloneNode(true);
                clone.className = 'w-full h-full object-cover';
                clone.autoplay = true;
                clone.playsInline = true;
                clone.muted = false;
                if (identity === window.appState.name && !identity.startsWith('screen-')) clone.style.transform = 'scaleX(-1)';
                box.appendChild(clone);
                // Продолжаем обновлять, если это стрим
                const srcStream = v.srcObject;
                if (srcStream) clone.srcObject = srcStream;
            } else if (cv) {
                // Canvas — копируем содержимое через requestAnimationFrame
                const cloneCanvas = document.createElement('canvas');
                cloneCanvas.width = cv.width;
                cloneCanvas.height = cv.height;
                cloneCanvas.className = 'w-full h-full object-cover';
                box.appendChild(cloneCanvas);
                const cctx = cloneCanvas.getContext('2d');
                const renderLoop = () => {
                    if (!document.body.contains(cloneCanvas)) return;
                    try { cctx.drawImage(cv, 0, 0, cloneCanvas.width, cloneCanvas.height); } catch (e) {}
                    requestAnimationFrame(renderLoop);
                };
                renderLoop();
            }

            window.appState.stageIdentity = identity;
            document.getElementById('mainNameLabel').innerText = identity === window.appState.name ? identity + ' (Вы)' : identity;
            document.getElementById('clearStageBtn').classList.remove('hidden');

            document.querySelectorAll('.guest-tile').forEach(t => t.classList.remove('on-stage'));
            const tile = document.getElementById('guest-tile-' + identity);
            if (tile) tile.classList.add('on-stage');
        };

        window.clearStage = function() {
            const prevIdentity = window.appState.stageIdentity;
            const box = document.getElementById('mainVideoBox');
            box.querySelectorAll('video, canvas').forEach(v => v.remove());
            document.getElementById('stageBgImage').style.display = 'block';
            document.getElementById('mainNameLabel').innerText = 'Сцена свободна';
            document.getElementById('mainHostBadge').classList.add('hidden');
            document.getElementById('clearStageBtn').classList.add('hidden');
            window.appState.stageIdentity = null;
            document.querySelectorAll('.guest-tile').forEach(t => t.classList.remove('on-stage'));

            if (prevIdentity && window.appState.room && window.appState.isHost) {
                const payload = new TextEncoder().encode(JSON.stringify({ type: 'stage-removed' }));
                window.appState.room.localParticipant.publishData(payload, { reliable: true });
            }
        };

        // ============ ЗАПРОС ОТ ГОСТЯ ============
        window.requestStage = function() {
            if (!window.appState.room || window.appState.isHost) return;
            const payload = new TextEncoder().encode(JSON.stringify({
                type: 'stage-request',
                name: window.appState.name
            }));
            window.appState.room.localParticipant.publishData(payload, { reliable: true });
            showToast('📨 Запрос отправлен!');
            document.getElementById('requestStageLabel').innerText = 'Запрос отправлен';
            document.getElementById('requestStageBtn').classList.add('opacity-50', 'pointer-events-none');
        };

        function showRequestCard(name, identity) {
            const container = document.getElementById('requestsContainer');
            const safeId = escapeHtml(identity).replace(/'/g, '&#39;');
            const card = document.createElement('div');
            card.className = 'request-card bg-studio-800 border-2 border-amber-500 rounded-xl p-4 shadow-2xl';
            card.innerHTML = `
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-r from-amber-500 to-orange-600 flex items-center justify-center text-white font-bold">
                        ${escapeHtml(name).charAt(0).toUpperCase()}
                    </div>
                    <div class="flex-1">
                        <p class="text-white font-bold text-sm">${escapeHtml(name)}</p>
                        <p class="text-amber-400 text-[10px]">хочет выйти в эфир</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button data-id="${safeId}" onclick="approveRequest(this.dataset.id, this)" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold transition">
                        <i class="fa-solid fa-check"></i> Одобрить
                    </button>
                    <button data-id="${safeId}" onclick="denyRequest(this.dataset.id, this)" class="flex-1 bg-studio-700 hover:bg-studio-600 text-gray-300 py-2 rounded-lg text-xs font-bold transition">
                        <i class="fa-solid fa-xmark"></i> Отклонить
                    </button>
                </div>
            `;
            container.appendChild(card);
            setTimeout(() => { if (card.parentNode) card.remove(); }, 45000);
        }

        window.approveRequest = function(identity, btn) {
            const room = window.appState.room;
            const payload = new TextEncoder().encode(JSON.stringify({
                type: 'stage-approved',
                identity: identity
            }));
            room.localParticipant.publishData(payload, { reliable: true });
            setTimeout(() => putOnStage(identity), 1500);
            btn.closest('.request-card').remove();
            showToast('✅ ' + identity + ' на сцене');
        };

        window.denyRequest = function(identity, btn) {
            const room = window.appState.room;
            const payload = new TextEncoder().encode(JSON.stringify({ type: 'stage-denied' }));
            room.localParticipant.publishData(payload, { reliable: true });
            btn.closest('.request-card').remove();
        };

        window.hostActionPutOnStage = function(identity) {
            if (!window.appState.isHost) return;
            const room = window.appState.room;
            const payload = new TextEncoder().encode(JSON.stringify({
                type: 'stage-approved',
                identity: identity
            }));
            room.localParticipant.publishData(payload, { reliable: true });
            setTimeout(() => putOnStage(identity), 1200);
        };

        // ============ ОРИЕНТАЦИЯ ============
        window.toggleOrientation = function() {
            const box = document.getElementById('mainVideoBox');
            if (window.appState.orientation === 'horizontal') {
                box.classList.add('vertical');
                window.appState.orientation = 'vertical';
                document.getElementById('orientationIcon').className = 'fa-solid fa-desktop text-studio-cyan';
                document.getElementById('orientationLabel').innerText = '16:9';
            } else {
                box.classList.remove('vertical');
                window.appState.orientation = 'horizontal';
                document.getElementById('orientationIcon').className = 'fa-solid fa-mobile-screen text-studio-cyan';
                document.getElementById('orientationLabel').innerText = '9:16';
            }
        };

        window.copyInviteLink = function() {
            const link = window.location.origin + window.location.pathname;
            navigator.clipboard.writeText(link).then(() => showToast('✅ Ссылка скопирована!')).catch(() => prompt('Скопируйте:', link));
        };

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-xl shadow-2xl z-[100] font-medium text-sm';
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        // ============ УПРАВЛЕНИЕ ============
        window.toggleRoomCam = async function() {
            if (!window.appState.room) return;
            try {
                const s = !window.appState.isRoomCamOn;
                if (window.appState.isHost && window.appState.studio) {
                    // Ведущий: включаем/выключаем видео-трек из canvas
                    await window.appState.room.localParticipant.setCameraEnabled(s);
                } else {
                    await window.appState.room.localParticipant.setCameraEnabled(s);
                }
                window.appState.isRoomCamOn = s;
                updateRoomIcons();
            } catch (err) { console.error(err); }
        };

        window.toggleRoomMic = async function() {
            if (!window.appState.room) return;
            try {
                const s = !window.appState.isRoomMicOn;
                await window.appState.room.localParticipant.setMicrophoneEnabled(s);
                window.appState.isRoomMicOn = s;
                updateRoomIcons();
            } catch (err) { console.error(err); }
        };

        function updateRoomIcons() {
            document.getElementById('roomCamIcon').className = window.appState.isRoomCamOn ? 'fa-solid fa-video text-studio-cyan' : 'fa-solid fa-video-slash text-red-400';
            document.getElementById('roomMicIcon').className = window.appState.isRoomMicOn ? 'fa-solid fa-microphone text-emerald-400' : 'fa-solid fa-microphone-slash text-red-400';
        }

        function updateParticipantCount() {
            if (!window.appState.room) return;
            const count = window.appState.room.remoteParticipants.size + 1;
            const word = count === 1 ? 'участник' : (count < 5 ? 'участника' : 'участников');
            document.getElementById('participantCountHeader').innerText = `${count} ${word}`;
        }

        window.leaveRoom = function() {
            if (window.appState.studio) window.appState.studio.stop();
            if (window.appState.room) {
                window.appState.room.disconnect();
                window.appState.room = null;
            }
            document.getElementById('guestGrid').innerHTML = '<div id="noGuestsHint" class="col-span-full text-center py-4 text-xs text-gray-500"><i class="fa-solid fa-user-plus mr-1"></i> Пока никого.</div>';
            clearStage();
            showScreen('screen-left');
        };

        window.returnToWelcome = function() {
            showScreen('screen-welcome');
            document.getElementById('inputName').value = '';
            document.getElementById('inputHostKey').value = '';
        };

        window.escapeHtml = function(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        };
    </script>

    <!-- ============ FIREBASE: чат ============ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, remove, serverTimestamp, query, limitToLast } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0G2ZiFEwSr3472_9SsLJUMs6RORmLFWs",
            authDomain: "meta-live-chat.firebaseapp.com",
            databaseURL: "https://meta-live-chat-default-rtdb.firebaseio.com",
            projectId: "meta-live-chat",
            storageBucket: "meta-live-chat.firebasestorage.app",
            messagingSenderId: "695456991297",
            appId: "1:695456991297:web:55961023f91b86487d1ec0"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getDatabase(fbApp);
        const FIXED_ROOM = "main-studio";
        let currentUser = null;

        signInAnonymously(auth).catch(err => console.error(err));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = {
                    uid: user.uid,
                    name: window.appState.name || ("@user_" + user.uid.slice(0, 5)),
                    avatar: "https://placehold.co/24x24/111827/ffffff?text=" + user.uid.charAt(0).toUpperCase()
                };
                console.log("🔥 Firebase OK");
            }
        });

        const chatMessages = document.getElementById('chatMessages');

        const observer = new MutationObserver(() => {
            if (document.getElementById('screen-room').classList.contains('active') && !window._chatLoaded) {
                window._chatLoaded = true;
                loadMessages();
                loadLikes();
            }
        });
        observer.observe(document.getElementById('screen-room'), { attributes: true });

        function loadMessages() {
            const q = query(ref(db, `rooms/${FIXED_ROOM}/messages`), limitToLast(100));
            onValue(q, (snap) => {
                chatMessages.querySelectorAll('[data-msg]').forEach(el => el.remove());
                const data = snap.val();
                if (!data) return;
                Object.entries(data).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0)).forEach(([id, msg]) => renderMessage(id, msg));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function renderMessage(id, msg) {
            const isSelf = currentUser && msg.uid === currentUser.uid;
            const canModerate = window.appState.isHost;
            const div = document.createElement('div');
            div.dataset.msg = id;
            div.className = 'flex items-start gap-2 p-2 rounded-xl border group ' + (isSelf ? 'bg-studio-accent/10 border-studio-accent/40' : 'bg-studio-700/30 border-studio-700/50');
            div.innerHTML = `
                <img src="${msg.avatar}" class="w-6 h-6 rounded-full" alt="avatar">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="font-bold ${isSelf ? 'text-studio-accent' : 'text-studio-cyan'}">${escapeHtml(msg.name)}</span>
                    </div>
                    <p class="text-gray-200 mt-0.5 break-words">${escapeHtml(msg.text)}</p>
                </div>
                ${canModerate ? `<button onclick="deleteMessage('${id}')" class="opacity-0 group-hover:opacity-100 transition text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash text-xs"></i></button>` : ''}
            `;
            chatMessages.appendChild(div);
        }

        window.deleteMessage = function(id) {
            if (!window.appState.isHost) return;
            if (!confirm('Удалить это сообщение у всех?')) return;
            remove(ref(db, `rooms/${FIXED_ROOM}/messages/${id}`)).catch(err => console.error(err));
        };

        window.handleSendMessage = function(event) {
            event.preventDefault();
            if (!currentUser) return;
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            push(ref(db, `rooms/${FIXED_ROOM}/messages`), {
                uid: currentUser.uid,
                name: window.appState.name || currentUser.name,
                avatar: currentUser.avatar,
                text: text.slice(0, 300),
                ts: serverTimestamp()
            }).catch(err => console.error(err));
            input.value = '';
        };

        function loadLikes() {
            const q = query(ref(db, `rooms/${FIXED_ROOM}/likes`), limitToLast(1));
            onValue(q, (snap) => {
                const data = snap.val();
                if (!data) return;
                const [id, like] = Object.entries(data)[0];
                if (currentUser && like.uid !== currentUser.uid) {
                    if (Date.now() - (like.ts || 0) < 3000) animateLikeBurst();
                }
                setTimeout(() => remove(ref(db, `rooms/${FIXED_ROOM}/likes/${id}`)).catch(() => {}), 6000);
            });
        }

        window.sendLikeBurst = function() {
            if (!currentUser) return;
            animateLikeBurst();
            push(ref(db, `rooms/${FIXED_ROOM}/likes`), { uid: currentUser.uid, ts: Date.now() }).catch(err => console.error(err));
        };

        function animateLikeBurst() {
            const container = document.getElementById('floatingReactionsContainer');
            if (!container) return;
            const colors = ['#ff0050', '#00f2fe', '#ffd700', '#ff69b4', '#00ffcc'];
            for (let i = 0; i < 6; i++) {
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.innerHTML = `<i class="fa-solid fa-heart text-2xl" style="color:${colors[Math.floor(Math.random() * colors.length)]}"></i>`;
                h.style.left = `${Math.random() * 80 + 10}%`;
                h.style.bottom = '10px';
                container.appendChild(h);
                setTimeout(() => h.remove(), 3000);
            }
        }

        window.escapeHtml = function(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        };
    </script>
</body>
</html>
