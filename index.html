<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProStream Studio — Видеовстречи</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { studio: { 900: '#0b0f19', 800: '#111827', 700: '#1f2937', 600: '#374151', accent: '#ff0050', accentHover: '#e00045', cyan: '#00f2fe' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        @keyframes floatUp { 0% { transform: translateY(0px) scale(0.6); opacity: 1; } 50% { transform: translateY(-180px) scale(1.2); opacity: 0.8; } 100% { transform: translateY(-350px) scale(1.6); opacity: 0; } }
        .floating-heart { position: absolute; animation: floatUp 3s ease-in-out forwards; pointer-events: none; }
        .video-tile { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
        .video-tile video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="bg-studio-900 text-gray-100 min-h-screen flex flex-col antialiased">

    <!-- Верхняя шапка -->
    <header class="bg-studio-800 border-b border-studio-700 px-4 py-3 flex items-center justify-between z-30">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-r from-studio-accent to-studio-cyan p-2 rounded-xl text-white font-bold flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-video text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white flex items-center gap-2">ProStream Studio <span class="bg-studio-accent text-xs px-2 py-0.5 rounded-full uppercase tracking-wider font-semibold">LIVE</span></h1>
                <p class="text-xs text-gray-400">Видеовстречи в реальном времени</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="hidden md:flex items-center bg-studio-700/60 px-3 py-1.5 rounded-lg border border-studio-600 text-xs text-gray-300">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2 animate-ping"></span>
                <span>Комната: <strong class="text-white">PRO-LIVE-88</strong></span>
            </div>
            <div class="flex items-center gap-2 bg-studio-700 px-3 py-1.5 rounded-lg">
                <img id="userAvatar" src="https://placehold.co/32x32/111827/ffffff?text=U" class="w-6 h-6 rounded-full border border-studio-cyan" alt="User">
                <span id="userNameDisplay" class="text-xs font-semibold">Подключение...</span>
            </div>
        </div>
    </header>

    <!-- Основное поле -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 p-4 overflow-hidden">

        <!-- Левая часть — видео-сетка -->
        <div class="lg:col-span-3 flex flex-col gap-4">
            <div class="relative flex-1 bg-studio-800 rounded-2xl border border-studio-700 overflow-hidden flex flex-col min-h-[480px] shadow-2xl">

                <div class="absolute top-4 left-4 z-20 flex items-center gap-2 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10 text-xs">
                    <span class="bg-red-600 w-2.5 h-2.5 rounded-full animate-pulse"></span>
                    <span class="font-bold text-white">В ЭФИРЕ</span>
                    <span class="text-gray-400">|</span>
                    <span id="participantCount" class="text-studio-cyan font-semibold"><i class="fa-solid fa-users mr-1"></i> 1 участник</span>
                </div>

                <div class="absolute top-4 right-4 z-20 flex items-center gap-2 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10 text-xs">
                    <span id="connectionStatus" class="text-gray-200"><i class="fa-solid fa-circle-notch fa-spin text-studio-cyan mr-1"></i> Подключение...</span>
                </div>

                <!-- Видео-сетка -->
                <div id="videoGrid" class="flex-1 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 p-4 bg-gradient-to-br from-studio-900 to-studio-800 overflow-y-auto auto-rows-fr">
                    <!-- Сюда LiveKit автоматически добавляет видео участников -->
                </div>

                <div id="floatingReactionsContainer" class="absolute bottom-16 right-8 w-48 h-64 pointer-events-none overflow-hidden z-20"></div>

                <!-- Нижняя панель управления -->
                <div class="bg-studio-800 border-t border-studio-700 px-6 py-3 flex flex-wrap items-center justify-between gap-3 z-20">
                    <div class="flex items-center space-x-2">
                        <button id="camBtn" onclick="toggleCam()" class="bg-studio-700 hover:bg-studio-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600 shadow">
                            <i id="camIcon" class="fa-solid fa-video text-studio-cyan"></i> Камера
                        </button>
                        <button id="micBtn" onclick="toggleMic()" class="bg-studio-700 hover:bg-studio-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600 shadow">
                            <i id="micIcon" class="fa-solid fa-microphone text-emerald-400"></i> Микрофон
                        </button>
                        <button onclick="toggleScreenShare()" class="bg-studio-700 hover:bg-studio-600 text-white px-4 py-2 rounded-xl text-xs font-medium transition flex items-center gap-2 border border-studio-600 shadow">
                            <i class="fa-solid fa-desktop text-purple-400"></i> Экран
                        </button>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="sendLikeBurst()" class="bg-gradient-to-r from-studio-accent to-pink-600 hover:from-studio-accentHover hover:to-pink-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-lg">
                            <i class="fa-solid fa-heart animate-bounce"></i> Лайк
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая часть — чат -->
        <div class="lg:col-span-1 bg-studio-800 rounded-2xl border border-studio-700 flex flex-col h-[650px] shadow-2xl overflow-hidden">
            <div class="p-3.5 bg-studio-800 border-b border-studio-700 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-comments text-studio-accent"></i>
                    <h2 class="font-bold text-sm text-white">Чат</h2>
                </div>
                <span class="bg-studio-700 text-studio-cyan text-[10px] px-2 py-0.5 rounded-full font-semibold border border-studio-600">Firebase</span>
            </div>

            <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-3 flex flex-col text-xs">
                <div class="text-center my-2"><span class="bg-studio-700/80 text-gray-400 text-[10px] px-3 py-1 rounded-full border border-studio-600">Добро пожаловать!</span></div>
            </div>

            <div class="p-3 bg-studio-800 border-t border-studio-700">
                <form id="chatForm" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                    <input type="text" id="chatInput" placeholder="Написать сообщение..." maxlength="300" class="flex-1 bg-studio-900 border border-studio-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-studio-accent transition">
                    <button type="submit" class="bg-studio-accent hover:bg-studio-accentHover text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- ============================================================= -->
    <!-- LIVEKIT SDK                                                    -->
    <!-- ============================================================= -->
    <script type="module">
        import {
            Room,
            RoomEvent,
            Track,
            createLocalTracks
        } from 'https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.esm.mjs';

        // ============ НАСТРОЙКИ ============
        const TOKEN_SERVER_URL = "https://prostream-signaling.onrender.com"; // URL твоего Render
        const ROOM_NAME = "PRO-LIVE-88";
        const PARTICIPANT_NAME = "@user_" + Math.random().toString(36).substr(2, 5);

        let room = null;
        let localVideoTrack = null;
        let localAudioTrack = null;
        let isCamEnabled = true;
        let isMicEnabled = true;

        // ============ ПОДКЛЮЧЕНИЕ К LIVEKIT ============
        async function connectToRoom() {
            try {
                // 1. Получаем токен с Render
                const res = await fetch(`${TOKEN_SERVER_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        roomName: ROOM_NAME,
                        participantName: PARTICIPANT_NAME
                    })
                });

                if (!res.ok) throw new Error('Не удалось получить токен');
                const { token, url } = await res.json();

                // 2. Создаём комнату LiveKit
                room = new Room({
                    adaptiveStream: true,
                    dynacast: true,
                    videoCaptureDefaults: {
                        resolution: { width: 1280, height: 720 }
                    }
                });

                // 3. Обработчики событий
                room
                    .on(RoomEvent.ParticipantConnected, (participant) => {
                        console.log('👤 Участник подключился:', participant.identity);
                        updateParticipantCount();
                    })
                    .on(RoomEvent.ParticipantDisconnected, (participant) => {
                        console.log('👤 Участник отключился:', participant.identity);
                        updateParticipantCount();
                    })
                    .on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
                        console.log('📺 Получен трек от', participant.identity);
                        attachTrack(track, participant);
                    })
                    .on(RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
                        const el = document.getElementById('video-' + participant.identity);
                        if (el && track.kind === Track.Kind.Video) {
                            const videoEl = el.querySelector('video');
                            if (videoEl) videoEl.remove();
                        }
                    })
                    .on(RoomEvent.LocalTrackPublished, (publication) => {
                        console.log('📤 Локальный трек опубликован');
                        attachLocalTrack(publication.track);
                    })
                    .on(RoomEvent.Disconnected, () => {
                        console.log('❌ Отключен от комнаты');
                        updateStatus('Отключен', 'red');
                    });

                // 4. Подключаемся
                await room.connect(url, token);
                console.log('✅ Подключен к LiveKit');

                // 5. Публикуем свою камеру и микрофон
                await room.localParticipant.enableCameraAndMicrophone();
                console.log('📤 Локальные треки опубликованы');

                // 6. Прикрепляем локальные треки к сетке
                room.localParticipant.trackPublications.forEach((pub) => {
                    if (pub.track) attachLocalTrack(pub.track);
                });

                updateStatus('Подключен', 'green');
                updateParticipantCount();
                document.getElementById('userNameDisplay').innerText = PARTICIPANT_NAME;

            } catch (err) {
                console.error('❌ Ошибка подключения к LiveKit:', err);
                updateStatus('Ошибка: ' + err.message, 'red');
            }
        }

        // ============ ОТОБРАЖЕНИЕ ВИДЕО ============
        function createVideoTile(identity, isLocal = false) {
            let tile = document.getElementById('tile-' + identity);
            if (tile) return tile;

            tile = document.createElement('div');
            tile.id = 'tile-' + identity;
            tile.className = 'video-tile relative';
            tile.innerHTML = `
                <div id="video-${identity}" class="w-full h-full"></div>
                <div class="absolute bottom-2 left-2 bg-black/70 backdrop-blur-sm px-2 py-1 rounded-lg text-[11px] font-medium text-white border border-white/10">
                    <i class="fa-solid fa-user mr-1 ${isLocal ? 'text-studio-cyan' : 'text-gray-300'}"></i>
                    ${isLocal ? 'Вы' : identity}
                </div>
            `;
            document.getElementById('videoGrid').appendChild(tile);
            return tile;
        }

        function attachLocalTrack(track) {
            if (track.kind === Track.Kind.Video) {
                const tile = createVideoTile(PARTICIPANT_NAME, true);
                const videoEl = track.attach();
                videoEl.className = 'w-full h-full object-cover transform -scale-x-100';
                document.getElementById('video-' + PARTICIPANT_NAME).appendChild(videoEl);
            }
        }

        function attachTrack(track, participant) {
            if (track.kind === Track.Kind.Video) {
                createVideoTile(participant.identity, false);
                const videoEl = track.attach();
                videoEl.className = 'w-full h-full object-cover';
                document.getElementById('video-' + participant.identity).appendChild(videoEl);
            } else if (track.kind === Track.Kind.Audio) {
                const audioEl = track.attach();
                audioEl.autoplay = true;
                document.body.appendChild(audioEl);
            }
        }

        // ============ УПРАВЛЕНИЕ ============
        window.toggleCam = async function() {
            if (!room) return;
            isCamEnabled = !isCamEnabled;
            await room.localParticipant.setCameraEnabled(isCamEnabled);
            document.getElementById('camIcon').className = isCamEnabled
                ? 'fa-solid fa-video text-studio-cyan'
                : 'fa-solid fa-video-slash text-red-400';
        };

        window.toggleMic = async function() {
            if (!room) return;
            isMicEnabled = !isMicEnabled;
            await room.localParticipant.setMicrophoneEnabled(isMicEnabled);
            document.getElementById('micIcon').className = isMicEnabled
                ? 'fa-solid fa-microphone text-emerald-400'
                : 'fa-solid fa-microphone-slash text-red-400';
        };

        window.toggleScreenShare = async function() {
            if (!room) return;
            try {
                await room.localParticipant.setScreenShareEnabled(true);
                console.log('🖥 Демонстрация экрана включена');
            } catch (err) {
                console.error('Ошибка screen share:', err);
            }
        };

        function updateStatus(text, color) {
            const colorMap = { green: 'text-emerald-400', red: 'text-red-400', gray: 'text-gray-300' };
            document.getElementById('connectionStatus').innerHTML =
                `<i class="fa-solid fa-circle text-[8px] mr-1 ${colorMap[color] || 'text-gray-300'}"></i> ${text}`;
        }

        function updateParticipantCount() {
            if (!room) return;
            const count = room.remoteParticipants.size + 1;
            document.getElementById('participantCount').innerHTML =
                `<i class="fa-solid fa-users mr-1"></i> ${count} участник${count === 1 ? '' : count < 5 ? 'а' : 'ов'}`;
        }

        // ============ ЗАПУСК ============
        window.addEventListener('DOMContentLoaded', () => {
            updateStatus('Подключение...', 'gray');
            connectToRoom();
        });

        window.addEventListener('beforeunload', () => {
            if (room) room.disconnect();
        });
    </script>

    <!-- ============================================================= -->
    <!-- FIREBASE: чат + лайки                                           -->
    <!-- ============================================================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getDatabase, ref, push, onValue, set, onDisconnect, serverTimestamp, query, limitToLast, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0G2ZiFEwSr3472_9SsLJUMs6RORmLFWs",
            authDomain: "meta-live-chat.firebaseapp.com",
            databaseURL: "https://meta-live-chat-default-rtdb.firebaseio.com",
            projectId: "meta-live-chat",
            storageBucket: "meta-live-chat.firebasestorage.app",
            messagingSenderId: "695456991297",
            appId: "1:695456991297:web:55961023f91b86487d1ec0"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getDatabase(fbApp);
        const ROOM_ID = "PRO-LIVE-88";
        let currentUser = null;

        signInAnonymously(auth).catch(err => console.error("Auth error:", err));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = {
                    uid: user.uid,
                    name: "@user_" + user.uid.slice(0, 5),
                    avatar: "https://placehold.co/24x24/111827/ffffff?text=" + user.uid.charAt(0).toUpperCase()
                };
                document.getElementById('userAvatar').src = currentUser.avatar.replace('24x24', '32x32');
                loadMessages();
                loadLikes();
                console.log("🔥 Firebase OK. Room:", ROOM_ID);
            }
        });

        const chatMessages = document.getElementById('chatMessages');

        function loadMessages() {
            const q = query(ref(db, `rooms/${ROOM_ID}/messages`), limitToLast(100));
            onValue(q, (snap) => {
                chatMessages.querySelectorAll('[data-msg]').forEach(el => el.remove());
                const data = snap.val();
                if (!data) return;
                Object.entries(data).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0)).forEach(([id, msg]) => renderMessage(id, msg));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function renderMessage(id, msg) {
            const isSelf = currentUser && msg.uid === currentUser.uid;
            const div = document.createElement('div');
            div.dataset.msg = id;
            div.className = 'flex items-start gap-2 p-2 rounded-xl border ' + (isSelf ? 'bg-studio-accent/10 border-studio-accent/40' : 'bg-studio-700/30 border-studio-700/50');
            div.innerHTML = `
                <img src="${msg.avatar}" class="w-6 h-6 rounded-full" alt="avatar">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="font-bold ${isSelf ? 'text-studio-accent' : 'text-studio-cyan'}">${escapeHtml(msg.name)}</span>
                    </div>
                    <p class="text-gray-200 mt-0.5 break-words">${escapeHtml(msg.text)}</p>
                </div>`;
            chatMessages.appendChild(div);
        }

        window.handleSendMessage = function(event) {
            event.preventDefault();
            if (!currentUser) return;
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            push(ref(db, `rooms/${ROOM_ID}/messages`), {
                uid: currentUser.uid, name: currentUser.name, avatar: currentUser.avatar,
                text: text.slice(0, 300), ts: serverTimestamp()
            }).catch(err => console.error("Send error:", err));
            input.value = '';
        };

        function loadLikes() {
            const q = query(ref(db, `rooms/${ROOM_ID}/likes`), limitToLast(1));
            onValue(q, (snap) => {
                const data = snap.val();
                if (!data) return;
                const [id, like] = Object.entries(data)[0];
                if (currentUser && like.uid !== currentUser.uid) {
                    if (Date.now() - (like.ts || 0) < 3000) animateLikeBurst();
                }
                setTimeout(() => remove(ref(db, `rooms/${ROOM_ID}/likes/${id}`)).catch(() => {}), 6000);
            });
        }

        window.sendLikeBurst = function() {
            if (!currentUser) return;
            animateLikeBurst();
            push(ref(db, `rooms/${ROOM_ID}/likes`), { uid: currentUser.uid, ts: Date.now() }).catch(err => console.error("Like error:", err));
        };

        function animateLikeBurst() {
            const container = document.getElementById('floatingReactionsContainer');
            const colors = ['#ff0050', '#00f2fe', '#ffd700', '#ff69b4', '#00ffcc'];
            for (let i = 0; i < 6; i++) {
                const h = document.createElement('div');
                h.className = 'floating-heart';
                h.innerHTML = `<i class="fa-solid fa-heart text-2xl" style="color:${colors[Math.floor(Math.random() * colors.length)]}"></i>`;
                h.style.left = `${Math.random() * 80 + 10}%`;
                h.style.bottom = '10px';
                container.appendChild(h);
                setTimeout(() => h.remove(), 3000);
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
