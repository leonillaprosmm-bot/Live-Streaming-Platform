<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>METAIMPERIYA — Прямой эфир</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0b0f19;color:#eee;overflow-x:hidden;min-height:100vh}
.screen{display:none}
.screen.active{display:flex;flex-direction:column}

.welcome-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.welcome-box{max-width:420px;width:100%}
.welcome-logo{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:16px;background:linear-gradient(90deg,#ff0050,#00f2fe);margin-bottom:16px;text-decoration:none}
.welcome-form{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:24px}
.welcome-form label{display:block;font-size:11px;color:#999;margin-bottom:6px}
.welcome-form input{width:100%;background:#0b0f19;border:1px solid #1f2937;border-radius:10px;padding:12px;color:white;font-size:14px;margin-bottom:14px;font-family:inherit}
.welcome-form input:focus{outline:none;border-color:#ff3366}
.welcome-form button{width:100%;background:linear-gradient(90deg,#ff0050,#e00045);color:white;border:none;padding:14px;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;font-family:inherit}
.welcome-form button:disabled{opacity:.5;cursor:wait}
.welcome-info{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#34d399;font-size:11px;padding:10px;border-radius:8px;margin-top:14px;text-align:center;line-height:1.6}
.welcome-back{display:block;text-align:center;margin-top:14px;color:#666;font-size:12px;text-decoration:none}

.live-header{background:#111827;border-bottom:1px solid #1f2937;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;flex-shrink:0}
.live-header-left{display:flex;align-items:center;gap:12px;min-width:0}
.live-header-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.h-logo{background:linear-gradient(90deg,#ff0050,#00f2fe);padding:8px;border-radius:10px;text-decoration:none;flex-shrink:0}
.live-header h1{margin:0;font-size:14px;color:white;font-weight:bold;white-space:nowrap}
.live-header p{margin:0;font-size:10px;color:#999}
.viewer-pill{background:rgba(0,242,254,.15);border:1px solid rgba(0,242,254,.4);color:#00f2fe;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:bold;display:flex;align-items:center;gap:6px;white-space:nowrap}
.viewer-pill .pulse{width:6px;height:6px;border-radius:50%;background:#00f2fe;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.btn-header{background:#1f2937;border:1px solid #374151;color:white;padding:8px 14px;border-radius:10px;font-size:11px;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-header:hover{background:#374151}
.btn-header.blue{background:linear-gradient(90deg,#00f2fe,#3b82f6);border:none;font-weight:bold}
.btn-header.red{background:rgba(220,38,38,.2);border:1px solid rgba(220,38,38,.4);color:#fca5a5}

.live-main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px;flex:1;min-height:0}
.live-left{display:flex;flex-direction:column;gap:12px;min-width:0;overflow:hidden}
.live-right{min-width:0;display:flex;flex-direction:column}

.stage-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:black;border-radius:16px;overflow:hidden;transition:all .3s;max-height:60vh}
.stage-wrapper.vertical{aspect-ratio:9/16;max-width:420px;margin:0 auto;max-height:70vh}
.stage-wrapper img,.stage-wrapper video,.stage-wrapper canvas,.stage-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border:none}
.stage-label{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:8px;font-size:11px;color:white;z-index:5;display:flex;gap:6px;align-items:center}
.stage-timer{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:8px;font-size:11px;color:#00f2fe;z-index:5;font-family:monospace;font-weight:bold;display:none}
.stage-clear-btn{position:absolute;top:10px;right:10px;background:#dc2626;color:white;border:none;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer;z-index:6;display:none}

.participants-title{font-size:11px;color:#999;text-transform:uppercase;margin:0 0 8px 0}
.guest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:220px;overflow-y:auto}
.guest-tile{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;border:2px solid transparent;cursor:pointer;transition:all .2s}
.guest-tile:hover{border-color:#00f2fe}
.guest-tile.on-stage{border-color:#ff0050;box-shadow:0 0 20px rgba(255,0,80,.5)}
.guest-tile video,.guest-tile canvas{width:100%;height:100%;object-fit:cover}
.guest-name{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:4px;font-size:10px;color:white;z-index:2}
.guest-timer{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:4px;font-size:10px;color:#00f2fe;z-index:2;font-family:monospace;font-weight:bold}
.guest-live-badge{position:absolute;top:4px;right:4px;background:#dc2626;color:white;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:bold;z-index:2;display:flex;align-items:center;gap:4px}
.guest-live-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1.5s infinite}
.tile-menu{display:none;position:absolute;top:4px;right:4px;z-index:10;margin-top:22px}
.guest-tile:hover .tile-menu{display:block}

.controls-bar{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.controls-bar-left{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.btn-ctrl{background:#1f2937;border:1px solid #374151;color:white;padding:8px 12px;border-radius:10px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-ctrl:hover{background:#374151}
.btn-like{background:linear-gradient(90deg,#ff0050,#ec4899);color:white;border:none;padding:8px 14px;border-radius:10px;font-size:11px;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.chat-panel{background:#111827;border:1px solid #1f2937;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;max-height:calc(100vh - 120px);height:100%}
.chat-header{padding:12px;border-bottom:1px solid #1f2937;flex-shrink:0;display:flex;justify-content:space-between;align-items:center}
.chat-header h2{margin:0;font-size:14px;color:white}
.chat-messages{flex:1;padding:12px;overflow-y:auto;font-size:12px;min-height:200px}
.chat-form{padding:12px;border-top:1px solid #1f2937;display:flex;gap:6px;flex-shrink:0}
.chat-form input{flex:1;background:#0b0f19;border:1px solid #1f2937;border-radius:10px;padding:8px;color:white;font-size:12px;font-family:inherit;min-width:0}
.chat-form input:focus{outline:none;border-color:#ff0050}
.chat-form button{background:#ff0050;border:none;color:white;padding:8px 12px;border-radius:10px;cursor:pointer;flex-shrink:0}

.join-message{text-align:center;padding:6px;font-size:11px;color:#34d399;font-style:italic;font-family:monospace;background:rgba(16,185,129,.05);border-radius:6px;margin-bottom:8px}

@media(max-width:1024px){
  .live-main{grid-template-columns:1fr;padding:8px;gap:8px}
  .live-right{max-height:none}
  .chat-panel{max-height:400px}
  .stage-wrapper{max-height:50vh}
  .stage-wrapper.vertical{max-width:340px;max-height:60vh}
  .guest-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));max-height:180px}
}
@media(max-width:640px){
  .live-header{padding:10px 12px;gap:8px}
  .live-header h1{font-size:12px}
  .btn-header{padding:6px 10px;font-size:10px}
  .controls-bar{padding:10px}
  .btn-ctrl{padding:7px 10px;font-size:10px}
  .stage-wrapper{max-height:40vh;border-radius:12px}
  .stage-wrapper.vertical{max-width:280px;max-height:50vh}
  .guest-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;max-height:150px}
  .viewer-pill{padding:5px 10px;font-size:10px}
}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="screen-welcome" class="screen active">
<div class="welcome-wrap">
<div class="welcome-box">
<div style="text-align:center;margin-bottom:32px">
<a href="index.html" class="welcome-logo"><i class="fa-solid fa-video" style="font-size:24px;color:white"></i></a>
<h1 style="font-size:24px;font-weight:bold;color:white">METAIMPERIYA LIVE</h1>
<p style="color:#999;font-size:13px;margin-top:4px">Прямой эфир</p>
</div>
<div class="welcome-form">
<label>Ваше имя</label>
<input id="inputName" type="text" placeholder="Например: Иван" maxlength="30" autocomplete="off">
<label>Пароль ведущего (гости — оставьте пустым)</label>
<input id="inputHostKey" type="password" placeholder="admin123" autocomplete="off">
<button onclick="enterStream()" id="enterBtn"><i class="fa-solid fa-arrow-right"></i> Войти в эфир</button>
<div class="welcome-info">
<i class="fa-solid fa-circle-info"></i> Камера включится автоматически. С паролем — <strong>ведущий</strong>. Без пароля — <strong>гость</strong>.
</div>
<a href="index.html" class="welcome-back">← На главную</a>
</div>
</div>
</div>
</div>

<!-- ЭКРАН ЭФИРА -->
<div id="screen-room" class="screen">
<header class="live-header">
<div class="live-header-left">
<a href="index.html" class="h-logo"><i class="fa-solid fa-video" style="color:white"></i></a>
<div>
<h1>Прямой эфир <span style="background:#dc2626;font-size:10px;padding:2px 8px;border-radius:10px;color:white">● LIVE</span></h1>
<p id="roomSubtitle">—</p>
</div>
</div>
<div class="live-header-right">
<div class="viewer-pill"><span class="pulse"></span> <span id="viewerCount">0</span> смотрят</div>
<button class="btn-header" onclick="toggleOrientation()"><i id="orientIcon" class="fa-solid fa-mobile-screen" style="color:#00f2fe"></i> <span id="orientLabel">Горизонт</span></button>
<button class="btn-header blue" onclick="copyInviteLink()"><i class="fa-solid fa-link"></i> Ссылка</button>
<button class="btn-header red" onclick="leaveRoom()"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button>
</div>
</header>

<main class="live-main">
<div class="live-left">
<div id="stageWrapper" class="stage-wrapper">
<div id="mainVideoBox" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
<img id="stageBgImage" src="https://placehold.co/1280x720/0b0f19/00f2fe?text=METAIMPERIYA+LIVE&font=montserrat" style="width:100%;height:100%;object-fit:cover">
</div>
<div class="stage-label">
<i id="mainMicIcon" class="fa-solid fa-microphone" style="color:#34d399"></i>
<span id="mainNameLabel">Ожидание...</span>
</div>
<div class="stage-timer" id="stageTimer">00:00</div>
<button id="clearStageBtn" class="stage-clear-btn" onclick="clearStage()"><i class="fa-solid fa-xmark"></i> Убрать со сцены</button>
</div>

<div>
<h3 class="participants-title"><i class="fa-solid fa-users"></i> Участники (<span id="guestsCount">0</span>)</h3>
<div id="guestGrid" class="guest-grid">
<p id="noGuestsHint" style="color:#666;font-size:11px;text-align:center;grid-column:1/-1;padding:16px">Пока никого</p>
</div>
</div>

<div class="controls-bar">
<div class="controls-bar-left">
<button id="roomCamBtn" class="btn-ctrl" onclick="toggleRoomCam()"><i id="roomCamIcon" class="fa-solid fa-video" style="color:#00f2fe"></i> Камера</button>
<button id="roomMicBtn" class="btn-ctrl" onclick="toggleRoomMic()"><i id="roomMicIcon" class="fa-solid fa-microphone" style="color:#34d399"></i> Микрофон</button>
<button class="btn-ctrl" onclick="toggleScreenShare()"><i class="fa-solid fa-desktop" style="color:#a78bfa"></i> <span id="shareScreenLabel">Экран</span></button>
</div>
<button class="btn-like" onclick="sendLikeBurst()"><i class="fa-solid fa-heart"></i> Лайк</button>
</div>
</div>

<div class="live-right">
<div id="chatPanel" class="chat-panel">
<div class="chat-header"><h2><i class="fa-solid fa-comments" style="color:#ff0050"></i> Чат</h2></div>
<div id="chatMessages" class="chat-messages"></div>
<form class="chat-form" onsubmit="handleSendMessage(event)">
<input id="chatInput" type="text" placeholder="Написать..." maxlength="300">
<button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
</form>
</div>
</div>
</main>
</div>

<script type="module">
import { Room, RoomEvent, Track } from 'https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.esm.mjs';
import { Studio } from './studio.js';

const TOKEN_SERVER_URL = "https://prostream-signaling.onrender.com";
const FIXED_ROOM = "main-studio";
const HOST_PASSWORD = "admin123";

window.appState = {
    name: '', isHost: false, room: null, studio: null,
    isRoomCamOn: false, isRoomMicOn: true,
    stageIdentity: null, studioTrack: null,
    screenShareTrack: null, orientation: 'horizontal',
    iframeActive: false, selfOnStage: false,
    remoteStreams: {},
    joinTimes: {},
    timers: {}
};

window.studioCanvas = document.createElement('canvas');
window.studioCanvas.width = 1920;
window.studioCanvas.height = 1080;
window.studioCanvas.style.display = 'none';
document.body.appendChild(window.studioCanvas);

window.showScreen = function(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
};

window.enterStream = async function() {
    const name = document.getElementById('inputName').value.trim();
    const hostKey = document.getElementById('inputHostKey').value;
    if (!name) { alert('Введите ваше имя'); return; }

    const isHost = (hostKey === HOST_PASSWORD);

    const btn = document.getElementById('enterBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Подключение...';

    window.appState.name = name;
    window.appState.isHost = isHost;

    showScreen('screen-room');
    document.getElementById('roomSubtitle').innerText = (isHost ? '👑 Ведущий: ' : '👤 Гость: ') + name;

    await connectToLiveKit(isHost);
};

async function connectToLiveKit(isHost) {
    try {
        const res = await fetch(`${TOKEN_SERVER_URL}/token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ roomName: FIXED_ROOM, participantName: window.appState.name })
        });
        if (!res.ok) throw new Error('Не удалось получить токен');
        const { token, url } = await res.json();

        const room = new Room({ adaptiveStream: true, dynacast: true });
        window.appState.room = room;

        room
            .on(RoomEvent.ParticipantConnected, (p) => {
                console.log('👤 Зашёл:', p.identity);
                addChatMessage('СИСТЕМА', `${p.identity} зашёл в эфир`, false, true);
                renderGuestTile(p.identity, false);
                updateViewersCount();
            })
            .on(RoomEvent.ParticipantDisconnected, (p) => {
                console.log('👤 Вышел:', p.identity);
                addChatMessage('СИСТЕМА', `${p.identity} покинул эфир`, false, true);
                removeGuestTile(p.identity);
                delete window.appState.remoteStreams[p.identity];
                delete window.appState.joinTimes[p.identity];
                if (window.appState.timers[p.identity]) {
                    clearInterval(window.appState.timers[p.identity]);
                    delete window.appState.timers[p.identity];
                }
                if (window.appState.stageIdentity === p.identity) clearStage();
                updateViewersCount();
            })
            .on(RoomEvent.TrackSubscribed, (track, pub, participant) => attachRemoteTrack(track, participant))
            .on(RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
                if (track.kind === Track.Kind.Video) {
                    const c = document.getElementById('guest-video-' + participant.identity);
                    if (c) c.innerHTML = '<i class="fa-solid fa-user" style="color:#555;font-size:24px"></i>';
                }
            })
            .on(RoomEvent.LocalTrackPublished, (publication) => {
                if (publication.track) attachLocalTrack(publication.track);
            })
            .on(RoomEvent.DataReceived, (payload, participant) => {
                try {
                    const data = JSON.parse(new TextDecoder().decode(payload));
                    handleDataMessage(data, participant);
                } catch (e) {}
            });

        await room.connect(url, token);
        console.log('✅ Подключен как', isHost ? 'ВЕДУЩИЙ' : 'ГОСТЬ');

        if (isHost) {
            await startHostStudio();
        } else {
            // 🎥 Гость — камера и микрофон включаются сразу
            try {
                await room.localParticipant.enableCameraAndMicrophone();
                window.appState.isRoomCamOn = true;
                window.appState.isRoomMicOn = true;
            } catch (e) {
                console.warn('Камера недоступна:', e);
            }
        }
        updateRoomIcons();

        room.localParticipant.trackPublications.forEach((pub) => {
            if (pub.track) attachLocalTrack(pub.track);
        });

        room.remoteParticipants.forEach((p) => {
            renderGuestTile(p.identity, false);
            p.trackPublications.forEach((pub) => {
                if (pub.track && pub.isSubscribed) attachRemoteTrack(pub.track, p);
            });
        });

        updateViewersCount();

        // 🎬 Гость: показываем ведущего на сцене автоматически
        if (!isHost) {
            setTimeout(() => {
                room.remoteParticipants.forEach((p) => {
                    const c = document.getElementById('guest-video-' + p.identity);
                    if (c && c.querySelector('video') && !window.appState.stageIdentity) {
                        putOnStage(p.identity);
                    }
                });
            }, 1500);
        }

    } catch (err) {
        console.error('❌ Ошибка:', err);
        alert('Ошибка подключения: ' + err.message);
    }
}

async function startHostStudio() {
    const room = window.appState.room;
    const studio = new Studio(window.studioCanvas);
    window.appState.studio = studio;

    const outputStream = await studio.start();
    const videoTrack = outputStream.getVideoTracks()[0];
    const audioTrack = outputStream.getAudioTracks()[0];

    await room.localParticipant.publishTrack(videoTrack, { name: 'studio-video', source: Track.Source.Camera });
    window.appState.studioTrack = videoTrack;

    if (audioTrack) {
        await room.localParticipant.publishTrack(audioTrack, { name: 'studio-audio', source: Track.Source.Microphone });
    }

    window.appState.isRoomCamOn = true;
    window.appState.isRoomMicOn = true;
    updateRoomIcons();

    renderGuestTile(window.appState.name, true);
    const c = document.getElementById('guest-video-' + window.appState.name);
    c.innerHTML = '';
    window.studioCanvas.style.display = 'block';
    window.studioCanvas.style.width = '100%';
    window.studioCanvas.style.height = '100%';
    window.studioCanvas.style.objectFit = 'cover';
    c.appendChild(window.studioCanvas);

    setTimeout(() => {
        putOnStage(window.appState.name);
        window.appState.selfOnStage = true;
    }, 1000);
}

// ============ ТАЙМЕРЫ ============
function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function startTimer(identity) {
    if (window.appState.timers[identity]) return;
    window.appState.joinTimes[identity] = Date.now();
    window.appState.timers[identity] = setInterval(() => {
        const elapsed = Math.floor((Date.now() - window.appState.joinTimes[identity]) / 1000);
        const timerEl = document.getElementById('timer-' + identity);
        if (timerEl) timerEl.innerText = formatTime(elapsed);
        if (window.appState.stageIdentity === identity) {
            const stageTimer = document.getElementById('stageTimer');
            if (stageTimer) stageTimer.innerText = formatTime(elapsed);
        }
    }, 1000);
}

function updateViewersCount() {
    if (!window.appState.room) return;
    const count = window.appState.room.remoteParticipants.size + 1;
    document.getElementById('viewerCount').innerText = count;
}

function renderGuestTile(identity, isLocal) {
    if (document.getElementById('guest-tile-' + identity)) return;
    const hint = document.getElementById('noGuestsHint');
    if (hint) hint.style.display = 'none';

    const tile = document.createElement('div');
    tile.id = 'guest-tile-' + identity;
    tile.className = 'guest-tile';
    tile.onclick = () => { if (window.appState.isHost) putOnStage(identity); };
    tile.innerHTML = `
        <div id="guest-video-${identity}" style="width:100%;height:100%;background:#111827;display:flex;align-items:center;justify-content:center">
            <i class="fa-solid fa-user" style="color:#555;font-size:24px"></i>
        </div>
        <div class="guest-live-badge">LIVE</div>
        <div class="guest-timer" id="timer-${identity}">00:00</div>
        <div class="guest-name">${isLocal ? 'Вы' : escapeHtml(identity)}</div>
        ${window.appState.isHost && !isLocal ? `
        <div class="tile-menu">
            <button onclick="event.stopPropagation();putOnStage('${escapeHtml(identity).replace(/'/g,'&#39;')}')" style="background:#f59e0b;color:black;border:none;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:bold;cursor:pointer">
                <i class="fa-solid fa-arrow-up"></i> На сцену
            </button>
        </div>` : ''}
    `;
    document.getElementById('guestGrid').appendChild(tile);
    updateGuestsCount();
    startTimer(identity);
}

function removeGuestTile(identity) {
    const tile = document.getElementById('guest-tile-' + identity);
    if (tile) tile.remove();
    updateGuestsCount();
    if (document.querySelectorAll('.guest-tile').length === 0) {
        const hint = document.getElementById('noGuestsHint');
        if (hint) hint.style.display = 'block';
    }
}

function updateGuestsCount() {
    document.getElementById('guestsCount').innerText = document.querySelectorAll('.guest-tile').length;
}

function attachLocalTrack(track) {
    if (track.kind === Track.Kind.Video && window.appState.isHost) return;
    if (track.kind === Track.Kind.Video) {
        renderGuestTile(window.appState.name, true);
        const c = document.getElementById('guest-video-' + window.appState.name);
        c.innerHTML = '';
        const v = track.attach();
        v.style = 'width:100%;height:100%;object-fit:cover;transform:scaleX(-1)';
        c.appendChild(v);
    }
}

function attachRemoteTrack(track, participant) {
    if (track.kind === Track.Kind.Video) {
        let stream = window.appState.remoteStreams[participant.identity];
        if (!stream) {
            stream = new MediaStream();
            window.appState.remoteStreams[participant.identity] = stream;
        }
        stream.addTrack(track.mediaStreamTrack);
        renderGuestTile(participant.identity, false);
        const c = document.getElementById('guest-video-' + participant.identity);
        c.innerHTML = '';
        const v = track.attach();
        v.style = 'width:100%;height:100%;object-fit:cover';
        c.appendChild(v);

        if (!window.appState.isHost && !window.appState.stageIdentity) {
            setTimeout(() => {
                if (!window.appState.stageIdentity) putOnStage(participant.identity);
            }, 500);
        }
    } else if (track.kind === Track.Kind.Audio) {
        const a = track.attach();
        a.autoplay = true;
        document.body.appendChild(a);
    }
}

window.putOnStage = function(identity) {
    const box = document.getElementById('mainVideoBox');
    box.querySelectorAll('video, canvas').forEach(v => v.remove());
    document.getElementById('stageBgImage').style.display = 'none';

    const c = document.getElementById('guest-video-' + identity);
    if (!c) return;

    const v = c.querySelector('video');
    const cv = c.querySelector('canvas');

    if (!v && !cv) {
        document.getElementById('mainNameLabel').innerText = 'Ожидание видео...';
        setTimeout(() => putOnStage(identity), 1500);
        return;
    }

    if (cv) {
        box.appendChild(cv);
        cv.style.position = 'absolute';
        cv.style.top = '0';
        cv.style.left = '0';
        cv.style.width = '100%';
        cv.style.height = '100%';
        cv.style.objectFit = 'cover';
    } else if (v) {
        const clone = v.cloneNode(true);
        clone.style = 'width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0';
        clone.autoplay = true;
        clone.playsInline = true;
        clone.muted = false;
        if (identity === window.appState.name) clone.style.transform = 'scaleX(-1)';
        if (v.srcObject) clone.srcObject = v.srcObject;
        box.appendChild(clone);
    }

    window.appState.stageIdentity = identity;
    window.appState.selfOnStage = (identity === window.appState.name);
    document.getElementById('mainNameLabel').innerText = identity === window.appState.name ? identity + ' (Вы)' : identity;
    document.getElementById('clearStageBtn').style.display = 'block';

    const stageTimer = document.getElementById('stageTimer');
    stageTimer.style.display = 'block';
    const elapsed = Math.floor((Date.now() - (window.appState.joinTimes[identity] || Date.now())) / 1000);
    stageTimer.innerText = formatTime(elapsed);

    document.querySelectorAll('.guest-tile').forEach(t => t.classList.remove('on-stage'));
    const tile = document.getElementById('guest-tile-' + identity);
    if (tile) tile.classList.add('on-stage');

    if (window.appState.isHost && window.appState.room) {
        const payload = new TextEncoder().encode(JSON.stringify({ type: 'stage-show', identity: identity }));
        window.appState.room.localParticipant.publishData(payload, { reliable: true });
    }
};

window.clearStage = function() {
    const box = document.getElementById('mainVideoBox');
    box.querySelectorAll('video, canvas').forEach(v => v.remove());
    document.getElementById('stageBgImage').style.display = 'block';
    document.getElementById('mainNameLabel').innerText = 'Сцена свободна';
    document.getElementById('clearStageBtn').style.display = 'none';
    document.getElementById('stageTimer').style.display = 'none';
    window.appState.stageIdentity = null;
    window.appState.selfOnStage = false;
    document.querySelectorAll('.guest-tile').forEach(t => t.classList.remove('on-stage'));

    if (window.appState.isHost && window.appState.room) {
        const payload = new TextEncoder().encode(JSON.stringify({ type: 'stage-clear' }));
        window.appState.room.localParticipant.publishData(payload, { reliable: true });
    }
};

function handleDataMessage(data, participant) {
    if (data.type === 'stage-show') {
        if (data.identity) setTimeout(() => putOnStage(data.identity), 500);
    } else if (data.type === 'stage-clear') {
        const box = document.getElementById('mainVideoBox');
        box.querySelectorAll('video, canvas').forEach(v => v.remove());
        document.getElementById('stageBgImage').style.display = 'block';
        document.getElementById('mainNameLabel').innerText = 'Сцена свободна';
        document.getElementById('clearStageBtn').style.display = 'none';
        document.getElementById('stageTimer').style.display = 'none';
        window.appState.stageIdentity = null;
        if (window.appState.isHost) {
            setTimeout(() => putOnStage(window.appState.name), 500);
        }
    } else if (data.type === 'chat') {
        addChatMessage(data.name, data.text, false);
    }
}

window.toggleOrientation = function() {
    const wrapper = document.getElementById('stageWrapper');
    const icon = document.getElementById('orientIcon');
    const label = document.getElementById('orientLabel');
    const studio = window.appState.studio;

    if (window.appState.orientation === 'horizontal') {
        window.appState.orientation = 'vertical';
        wrapper.classList.add('vertical');
        icon.className = 'fa-solid fa-desktop';
        label.innerText = 'Вертикал';
        if (studio) studio.setOrientation('vertical');
    } else {
        window.appState.orientation = 'horizontal';
        wrapper.classList.remove('vertical');
        icon.className = 'fa-solid fa-mobile-screen';
        label.innerText = 'Горизонт';
        if (studio) studio.setOrientation('horizontal');
    }
};

window.toggleRoomMic = async function() {
    if (!window.appState.room) return;
    const s = !window.appState.isRoomMicOn;
    await window.appState.room.localParticipant.setMicrophoneEnabled(s);
    window.appState.isRoomMicOn = s;
    if (window.appState.studio) window.appState.studio.setMicEnabled(s);
    updateRoomIcons();
};

window.toggleRoomCam = async function() {
    if (!window.appState.room) return;
    const s = !window.appState.isRoomCamOn;
    if (window.appState.isHost && window.appState.studioTrack) {
        window.appState.studioTrack.enabled = s;
    } else {
        await window.appState.room.localParticipant.setCameraEnabled(s);
    }
    window.appState.isRoomCamOn = s;
    updateRoomIcons();
};

window.toggleScreenShare = async function() {
    if (!window.appState.room) return;
    try {
        const room = window.appState.room;
        if (window.appState.screenShareTrack) {
            await room.localParticipant.unpublishTrack(window.appState.screenShareTrack);
            window.appState.screenShareTrack.stop();
            window.appState.screenShareTrack = null;
            document.getElementById('shareScreenLabel').innerText = 'Экран';
        } else {
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
            const screenTrack = screenStream.getVideoTracks()[0];
            window.appState.screenShareTrack = screenTrack;
            await room.localParticipant.publishTrack(screenTrack, { name: 'screen-share', source: Track.Source.ScreenShare });
            document.getElementById('shareScreenLabel').innerText = 'Стоп';
            screenTrack.onended = () => { if (window.appState.screenShareTrack) window.toggleScreenShare(); };
        }
    } catch (err) { console.error(err); }
};

function updateRoomIcons() {
    document.getElementById('roomCamIcon').style.color = window.appState.isRoomCamOn ? '#00f2fe' : '#ef4444';
    document.getElementById('roomCamIcon').className = window.appState.isRoomCamOn ? 'fa-solid fa-video' : 'fa-solid fa-video-slash';
    document.getElementById('roomMicIcon').style.color = window.appState.isRoomMicOn ? '#34d399' : '#ef4444';
    document.getElementById('roomMicIcon').className = window.appState.isRoomMicOn ? 'fa-solid fa-microphone' : 'fa-solid fa-microphone-slash';
}

window.leaveRoom = function() {
    if (window.appState.studio) window.appState.studio.stop();
    if (window.appState.room) { window.appState.room.disconnect(); window.appState.room = null; }
    Object.values(window.appState.timers).forEach(t => clearInterval(t));
    location.reload();
};

window.copyInviteLink = function() {
    navigator.clipboard.writeText(window.location.origin + window.location.pathname)
        .then(() => alert('✅ Ссылка скопирована!'))
        .catch(() => prompt('Скопируйте:', window.location.origin));
};

window.escapeHtml = function(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
};

window.handleSendMessage = function(event) {
    event.preventDefault();
    if (!window.appState.room) return;
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    const payload = new TextEncoder().encode(JSON.stringify({ type: 'chat', name: window.appState.name, text: text.slice(0, 300) }));
    window.appState.room.localParticipant.publishData(payload, { reliable: true });
    addChatMessage(window.appState.name, text, true);
    input.value = '';
};

function addChatMessage(name, text, isSelf, isSystem) {
    const chatMessages = document.getElementById('chatMessages');
    const div = document.createElement('div');
    if (isSystem) {
        div.className = 'join-message';
        div.innerText = text;
    } else {
        div.style = 'padding:8px;margin-bottom:6px;border-radius:8px;background:' + (isSelf ? 'rgba(255,0,80,.1)' : 'rgba(55,65,81,.3)');
        div.innerHTML = '<strong style="color:' + (isSelf ? '#ff0050' : '#00f2fe') + '">' + escapeHtml(name) + '</strong><br>' + escapeHtml(text);
    }
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

window.sendLikeBurst = function() {
    for (let i = 0; i < 6; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.style = 'position:fixed;bottom:100px;right:' + (30 + Math.random() * 60) + 'px;font-size:24px;pointer-events:none;z-index:9999;transition:all 2s';
        document.body.appendChild(heart);
        setTimeout(() => {
            heart.style.transform = 'translateY(-300px) scale(1.5)';
            heart.style.opacity = '0';
        }, 50);
        setTimeout(() => heart.remove(), 2100);
    }
};
</script>
